<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeuroSnake — Neuroevolution Lab</title>
<style>
:root{--bg:#030604;--panel:#07100a;--line:#17351d;--green:#50ff78;--muted:#69a978;--red:#ff4055;--amber:#ffd166}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--green);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
body{display:flex;flex-direction:column}header{height:68px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 18px;background:linear-gradient(180deg,#061008,#030604)}
.brand{font-size:20px;font-weight:800;letter-spacing:.08em}.sub{font-size:11px;color:#4c855a;margin-top:3px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:116px;border:1px solid var(--line);padding:7px 10px;background:#050b06}.stat b{display:block;color:#7dff9c;font-size:14px}.stat span{font-size:9px;color:#4d8359}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(320px,.88fr);gap:10px;padding:10px}.panel{position:relative;border:1px solid var(--line);background:radial-gradient(circle at 30% 20%,#0a170d 0,#050b06 40%,#030604 100%);min-height:0;overflow:hidden}.panel h2{position:absolute;z-index:2;left:12px;top:10px;margin:0;font-size:11px;letter-spacing:.12em;color:#6eb77b;font-weight:600}#net,#game{width:100%;height:100%;display:block}.legend{position:absolute;left:12px;bottom:10px;font-size:10px;color:#477852;background:#030604cc;padding:6px 8px;border:1px solid #102717}.controls{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}.btn{background:#07120a;border:1px solid #1b4d26;color:#7dff9c;padding:7px 10px;font:inherit;font-size:10px;cursor:pointer}.btn:hover{background:#0b1d10}.btn:active{transform:translateY(1px)}
@media(max-width:900px){header{height:auto;padding:10px;display:block}.stats{margin-top:8px;justify-content:flex-start}.stat{min-width:100px}main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.brand{font-size:17px}}
</style>
</head>
<body>
<header><div><div class="brand">NEURO<span style="color:#9dffb1">SNAKE</span> // GENETIC LAB</div><div class="sub">FEEDFORWARD NEURAL NETWORK × EVOLUTIONARY SEARCH // LIVE SIGNAL MONITOR</div></div><div class="stats"><div class="stat"><b id="gen">1</b><span>GENERATION</span></div><div class="stat"><b id="alive">100</b><span>ALIVE</span></div><div class="stat"><b id="global">0</b><span>GLOBAL BEST</span></div><div class="stat"><b id="score">0</b><span>CURRENT SCORE</span></div><div class="stat"><b id="fitness">0</b><span>FITNESS</span></div></div></header>
<main>
<section class="panel"><h2>01 // NEURAL CORTEX</h2><canvas id="net"></canvas><div class="legend">SIGNAL = |activation × weight| · BRIGHTNESS ∝ signal · RED = negative weight</div></section>
<section class="panel"><h2>02 // ENVIRONMENT</h2><canvas id="game"></canvas><div class="controls"><button class="btn" id="pause">PAUSE</button><button class="btn" id="reset">RESET EVOLUTION</button></div></section>
</main>
<script>
'use strict';
const netCanvas=document.getElementById('net'),gameCanvas=document.getElementById('game');const nctx=netCanvas.getContext('2d'),gctx=gameCanvas.getContext('2d');
const ui={gen:document.getElementById('gen'),alive:document.getElementById('alive'),global:document.getElementById('global'),score:document.getElementById('score'),fitness:document.getElementById('fitness')};
const W=24,H=24,POP=100,ELITE=8,MAX_STEPS=420;const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
let paused=false,generation=1,globalBest=0,bestAgentIndex=0;const INPUTS=['Ray Up','Ray Down','Ray Left','Ray Right','Ray NE','Ray NW','Ray SE','Ray SW','Apple Up','Apple Down','Apple Left','Apple Right'];const OUTPUTS=['> UP','> DOWN','> LEFT','> RIGHT'];const layers=[12,18,14,4],layerX=[.08,.36,.64,.90];let netPos=[],agents=[],currentBest=null;
function rand(a=-1,b=1){return a+Math.random()*(b-a)}function tanh(x){return Math.tanh(x)}
class Genome{constructor(g){this.weights=[];this.bias=[];if(g){this.weights=g.weights.map(m=>m.map(r=>r.slice()));this.bias=g.bias.map(a=>a.slice())}else for(let l=1;l<layers.length;l++){this.weights.push(Array.from({length:layers[l]},()=>Array.from({length:layers[l-1]},()=>rand())));this.bias.push(Array.from({length:layers[l]},()=>rand()))}}forward(input){let a=input.slice(),acts=[a];for(let l=0;l<this.weights.length;l++){const out=[];for(let i=0;i<this.weights[l].length;i++){let s=this.bias[l][i];for(let j=0;j<this.weights[l][i].length;j++)s+=this.weights[l][i][j]*a[j];out.push(tanh(s))}a=out;acts.push(a)}return{out:a,acts}}}
function cloneGenome(g){return new Genome(g)}function crossover(a,b){const c=new Genome();for(let l=0;l<c.weights.length;l++){for(let i=0;i<c.weights[l].length;i++){for(let j=0;j<c.weights[l][i].length;j++){c.weights[l][i][j]=Math.random()<.5?a.weights[l][i][j]:b.weights[l][i][j];if(Math.random()<.03)c.weights[l][i][j]+=rand(-.35,.35)}}for(let i=0;i<c.bias[l].length;i++)c.bias[l][i]=Math.random()<.5?a.bias[l][i]:b.bias[l][i]}return c}
class Snake{constructor(g,index){this.genome=g;this.index=index;this.reset()}reset(){this.body=[{x:Math.floor(W/2),y:Math.floor(H/2)}];this.dir=Math.floor(Math.random()*4);this.pending=this.dir;this.food=this.spawnFood();this.score=0;this.steps=0;this.life=0;this.dead=false;this.noFoodSteps=0;this.fitness=0;this.acts=null}spawnFood(){let p;do p={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)};while(this.body.some(b=>b.x===p.x&&b.y===p.y));return p}ray(dx,dy){let x=this.body[0].x,y=this.body[0].y,dist=0;while(true){x+=dx;y+=dy;if(x<0||x>=W||y<0||y>=H)return 1/(dist+1);dist++;if(this.body.some(b=>b.x===x&&b.y===y))return 1/(dist+1)}}inputs(){const h=this.body[0],f=this.food;return[this.ray(0,-1),this.ray(0,1),this.ray(-1,0),this.ray(1,0),this.ray(1,-1),this.ray(-1,-1),this.ray(1,1),this.ray(-1,1),f.y<h.y?1:0,f.y>h.y?1:0,f.x<h.x?1:0,f.x>h.x?1:0]}think(){this.acts=this.genome.forward(this.inputs());this.pending=this.acts.out.indexOf(Math.max(...this.acts.out))}step(){if(this.dead)return;this.think();const opposite=(this.pending+2)%4;if(opposite!==this.dir)this.dir=this.pending;const[dx,dy]=dirs[this.dir],head=this.body[0],next={x:head.x+dx,y:head.y+dy};this.steps++;this.life++;this.noFoodSteps++;if(next.x<0||next.x>=W||next.y<0||next.y>=H||this.body.some(b=>b.x===next.x&&b.y===next.y)){this.dead=true;this.finishFitness();return}this.body.unshift(next);if(next.x===this.food.x&&next.y===this.food.y){this.score++;this.noFoodSteps=0;this.food=this.spawnFood()}else this.body.pop();if(this.noFoodSteps>180||this.steps>MAX_STEPS){this.dead=true;this.finishFitness()}this.fitness=this.score*140+this.life+this.score*this.score*18}finishFitness(){this.fitness=this.score*140+this.life+this.score*this.score*18}}
function startPopulation(){agents=Array.from({length:POP},(_,i)=>new Snake(new Genome(),i))}function nextGeneration(){agents.forEach(a=>a.finishFitness());agents.sort((a,b)=>b.fitness-a.fitness);globalBest=Math.max(globalBest,agents[0].score);const survivors=agents.slice(0,ELITE).map(a=>cloneGenome(a.genome));agents=Array.from({length:POP},(_,i)=>new Snake(i<ELITE?cloneGenome(survivors[i]):crossover(survivors[Math.floor(Math.random()*survivors.length)],survivors[Math.floor(Math.random()*survivors.length)]),i));generation++;bestAgentIndex=0}
function resize(c){const r=c.parentElement.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,Math.floor(r.width*d));c.height=Math.max(1,Math.floor(r.height*d));c.style.width=r.width+'px';c.style.height=r.height+'px';return{w:r.width,h:r.height,d}}
function layoutNet(w,h){netPos=layers.map((count,l)=>Array.from({length:count},(_,i)=>({x:w*layerX[l],y:h*.16+(h*.67)*(count===1?.5:i/(count-1))})))}
function drawNet(){const d=resize(netCanvas);nctx.setTransform(d.d,0,0,d.d,0,0);nctx.clearRect(0,0,d.w,d.h);layoutNet(d.w,d.h);if(!currentBest||!currentBest.acts)return;const acts=currentBest.acts.acts;for(let l=0;l<netPos.length-1;l++){const a=netPos[l],b=netPos[l+1],wm=currentBest.genome.weights[l];for(let j=0;j<b.length;j++)for(let i=0;i<a.length;i++){const signal=Math.abs((acts[l][i]||0)*wm[j][i]),alpha=Math.min(.72,.03+signal*.32),width=.35+Math.min(2.4,signal*1.2),neg=wm[j][i]<0;nctx.beginPath();nctx.moveTo(a[i].x,a[i].y);nctx.lineTo(b[j].x,b[j].y);nctx.lineWidth=width;nctx.strokeStyle=neg?`rgba(255,70,90,${alpha*.8})`:`rgba(80,255,120,${alpha})`;nctx.stroke()}}layers.forEach((count,l)=>netPos[l].forEach((p,i)=>{const v=acts[l][i]||0,mag=Math.min(1,Math.abs(v));nctx.beginPath();nctx.arc(p.x,p.y,l===0?3.7:l===layers.length-1?6:5,0,Math.PI*2);nctx.fillStyle=`rgba(80,255,120,${.12+mag*.45})`;nctx.fill();nctx.lineWidth=1.2;nctx.strokeStyle=`rgba(80,255,120,${.38+mag*.6})`;nctx.stroke()}));nctx.font='10px ui-monospace,monospace';nctx.fillStyle='#5fae6d';nctx.textBaseline='middle';INPUTS.forEach((s,i)=>{nctx.textAlign='left';nctx.fillText(s,netPos[0][i].x+8,netPos[0][i].y)});OUTPUTS.forEach((s,i)=>{nctx.textAlign='right';nctx.fillText(s,netPos[3][i].x-10,netPos[3][i].y)});['INPUT','HIDDEN 1','HIDDEN 2','OUTPUT'].forEach((s,i)=>{nctx.textAlign='center';nctx.font='9px ui-monospace,monospace';nctx.fillStyle='#3f744b';nctx.fillText(s,netPos[i][0].x,d.h*.095)})}
function drawGame(){const d=resize(gameCanvas);gctx.setTransform(d.d,0,0,d.d,0,0);gctx.clearRect(0,0,d.w,d.h);const size=Math.min(d.w*.82,d.h*.82),cell=Math.floor(size/W),sx=(d.w-cell*W)/2,sy=(d.h-cell*H)/2;gctx.strokeStyle='#14351c';gctx.lineWidth=1;gctx.strokeRect(sx-.5,sy-.5,cell*W+1,cell*H+1);gctx.globalAlpha=.15;gctx.strokeStyle='#2c6b39';for(let x=1;x<W;x++){gctx.beginPath();gctx.moveTo(sx+x*cell,sy);gctx.lineTo(sx+x*cell,sy+H*cell);gctx.stroke()}for(let y=1;y<H;y++){gctx.beginPath();gctx.moveTo(sx,sy+y*cell);gctx.lineTo(sx+W*cell,sy+y*cell);gctx.stroke()}gctx.globalAlpha=1;if(!currentBest)return;const a=currentBest;a.body.forEach((p,i)=>{gctx.fillStyle=i===0?'#8aff9d':'#39d95f';gctx.fillRect(sx+p.x*cell+1,sy+p.y*cell+1,cell-2,cell-2)});gctx.fillStyle='#ff4055';gctx.fillRect(sx+a.food.x*cell+2,sy+a.food.y*cell+2,cell-4,cell-4);gctx.fillStyle='#74c982';gctx.font='11px ui-monospace,monospace';gctx.fillText(`BEST LIVE  •  SCORE ${a.score}  •  STEPS ${a.steps}`,sx,sy+H*cell+24);gctx.fillStyle=a.dead?'#ff4055':'#56ff80';gctx.fillText(a.dead?'STATUS: DEAD — EVOLVING':'STATUS: ALIVE — THINKING',sx,sy-12)}
function updateUI(){const alive=agents.filter(a=>!a.dead).length,b=currentBest||agents[0];ui.gen.textContent=generation;ui.alive.textContent=alive;ui.global.textContent=globalBest;ui.score.textContent=b?b.score:0;ui.fitness.textContent=b?Math.round(b.fitness):0}
function chooseBest(){let best=-Infinity;agents.forEach((a,i)=>{if(a.fitness>best){best=a.fitness;bestAgentIndex=i;currentBest=a}})}
function loop(){if(!paused){for(let s=0;s<2;s++){agents.forEach(a=>{if(!a.dead)a.step()});chooseBest();if(agents.every(a=>a.dead)){nextGeneration();chooseBest()}}}drawNet();drawGame();updateUI();requestAnimationFrame(loop)}
function init(){startPopulation();chooseBest();window.addEventListener('resize',()=>{resize(netCanvas);resize(gameCanvas)});requestAnimationFrame(loop)}
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'RESUME':'PAUSE'};document.getElementById('reset').onclick=()=>{generation=1;globalBest=0;agents=[];startPopulation();chooseBest()};init();
</script></body></html>
