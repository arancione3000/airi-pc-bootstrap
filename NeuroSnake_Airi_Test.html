<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeuroSnake</title><style>body{margin:0;background:#030604;color:#50ff78;font:14px monospace;display:grid;place-items:center;height:100vh}canvas{border:1px solid #17351d}</style></head><body><canvas id="c" width="900" height="520"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');x.fillStyle='#030604';x.fillRect(0,0,900,520);x.fillStyle='#50ff78';x.font='20px monospace';x.fillText('NEUROSNAKE // INITIALIZING',30,40);let t=0;setInterval(()=>{t++;x.fillStyle='#030604';x.fillRect(0,60,900,460);x.strokeStyle='#17351d';for(let i=0;i<12;i++){x.beginPath();x.moveTo(80+i*65,80);x.lineTo(80+i*65,420);x.stroke()}for(let i=0;i<30;i++){x.beginPath();x.moveTo(80,80+i*11);x.lineTo(820,80+i*11);x.stroke()}x.fillStyle='#39d95f';x.fillRect(560+(Math.sin(t/8)*120),250,14,14);x.fillStyle='#ff4055';x.fillRect(700,330,14,14);x.fillStyle='#50ff78';x.fillText('AI SIGNALS LIVE',30,500)},60)</script></body></html>
