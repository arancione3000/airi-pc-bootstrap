name: AIRI Phase 5 Root Cause Diagnostics

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'computer/generalist_lm/phase5_ablation.py'
      - 'computer/generalist_lm/bootstrap_training.py'
      - 'tests/test_generalist_phase5.py'
      - '.github/workflows/phase5-repetition-ablation.yml'

permissions:
  contents: read

concurrency:
  group: airi-phase5-repetition-ablation
  cancel-in-progress: true

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: computer
      STATE_REPO: /tmp/airi-phase5-ablation-state
      STATE_DIR: /tmp/airi-phase5-ablation-state/generalist-state
      OLD_REPO: /tmp/airi-phase5-r2-state
      OLD_DIR: /tmp/airi-phase5-r2-state/generalist-state/bootstrap-data/candidate
      R2_SHA: e7c2c14de4359dfab952f903a17e65fdf3877899
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu

      - name: Clone immutable live state
        run: |
          set -euo pipefail
          rm -rf "${STATE_REPO}"
          git clone --quiet --depth 1 --branch generalist-state --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${STATE_REPO}"
          test -f "${STATE_DIR}/bootstrap-data/candidate/model.pt"
          test -f "${STATE_DIR}/bootstrap-data/progress.json"
          test -f "${STATE_DIR}/bootstrap-data/optimizer.pt"
          rm -rf "${OLD_REPO}"
          git clone --quiet --no-checkout --filter=blob:none \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${OLD_REPO}"
          git -C "${OLD_REPO}" fetch --quiet --depth 1 origin "${R2_SHA}"
          git -C "${OLD_REPO}" checkout --quiet --detach "${R2_SHA}"
          test -f "${OLD_DIR}/model.pt"

      - name: Measure residual objective gradients
        run: |
          set -euo pipefail
          python -m generalist_lm.phase5_residual_gradient_diagnostic \
            --state-dir "${STATE_DIR}" \
            --output /tmp/phase5-residual-gradient.json \
            | tee /tmp/phase5-residual-gradient.stdout.json

      - name: Compare current and accepted R2 checkpoint
        run: |
          set -euo pipefail
          python -m generalist_lm.phase5_historical_r2_diff \
            --current "${STATE_DIR}/bootstrap-data/candidate" \
            --historical "${OLD_DIR}" \
            --source-d-ff 1888 \
            --output /tmp/phase5-r2-diff.json \
            | tee /tmp/phase5-r2-diff.stdout.json

      - name: Upload root-cause evidence
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-Phase5-Root-Cause-${{ github.run_number }}
          path: |
            /tmp/phase5-residual-gradient.json
            /tmp/phase5-r2-diff.json
          if-no-files-found: error
          retention-days: 7
