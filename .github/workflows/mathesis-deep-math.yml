name: MATHESIS Deep Mathlib Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'computer/mathesis/lean/**'
      - '.github/workflows/mathesis-deep-math.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: mathesis-deep-math
  cancel-in-progress: true

jobs:
  mathlib:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lean and Mathlib
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            computer/mathesis/lean/.lake/packages
            computer/mathesis/lean/.lake/build
          key: mathesis-mathlib-${{ runner.os }}-lean-4.34.0-mathlib-4.34.0

      - name: Install Lean toolchain
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl --proto '=https' --tlsv1.2 -sSf               https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh               -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.34.0
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.34.0
          "$HOME/.elan/bin/lean" --version

      - name: Resolve Mathlib 4.34
        working-directory: computer/mathesis/lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Verify MATHESIS theorem smoke with Mathlib
        working-directory: computer/mathesis/lean
        run: |
          set -euo pipefail
          # cache.get intentionally may omit a tiny aggregate object such as
          # Mathlib.olean. Build the dependency target first so Lean has a
          # complete import graph, then verify our theorem file and library.
          lake build Mathlib
          lake env lean Mathesis/DiscoverySmoke.lean
          lake build

      - name: Kick fast continuum after deep verification
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mathesis-continuum.yml/dispatches"             -d '{"ref":"main"}'
