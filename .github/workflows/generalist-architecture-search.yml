name: AIRI Generalist Architecture Search

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'computer/generalist_lm/architecture_*.py'
      - 'computer/generalist_lm/model.py'
      - 'computer/generalist_lm/model_factory.py'
      - 'computer/generalist_lm/meta_controller.py'
      - 'computer/generalist_lm/evolution.py'
      - 'computer/generalist_lm/mathesis_bridge.py'
      - '.github/workflows/generalist-architecture-search.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: airi-generalist-architecture-search
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run_search: ${{ steps.plan.outputs.run_search }}
      matrix: ${{ steps.plan.outputs.matrix }}
      cycle: ${{ steps.plan.outputs.cycle }}
      base_state_sha: ${{ steps.plan.outputs.base_state_sha }}
    env:
      PYTHONPATH: computer
      STATE_REPO: /tmp/airi-architecture-state-repo
      STATE_DIR: /tmp/airi-architecture-state
      MATHESIS_ROOT: /tmp/airi-mathesis
      MATHESIS_STATE_DIR: /tmp/airi-mathesis/mathesis-state
      BUNDLE: /tmp/architecture-plan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: computer/mathesis/requirements.txt

      - name: Install bounded architecture research runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r computer/mathesis/requirements.txt

      - name: Wait for current Generalist state writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            bootstrap="$(curl --fail-with-body -sS --retry 3 --retry-all-errors               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${GH_TOKEN}"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generalist-bootstrap.yml/runs?per_page=20")"
            continuum="$(curl --fail-with-body -sS --retry 3 --retry-all-errors               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${GH_TOKEN}"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generalist-continuum.yml/runs?per_page=20")"
            active="$(jq -n --argjson a "${bootstrap}" --argjson b "${continuum}" '
              [
                ($a.workflow_runs + $b.workflow_runs)[]
                | select(
                    .status == "pending"
                    or .status == "queued"
                    or .status == "in_progress"
                    or .status == "waiting"
                    or .status == "requested"
                  )
              ] | length
            ')"
            if (( active == 0 )); then
              echo "Architecture search owns a clean state snapshot window."
              exit 0
            fi
            echo "Waiting for ${active} active Generalist state-writer run(s)."
            sleep 20
          done
          echo "Timed out waiting for state-writer window." >&2
          exit 1

      - name: Restore persistent Generalist and MATHESIS state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "${STATE_REPO}" "${STATE_DIR}" "${MATHESIS_ROOT}"
          git clone --quiet             "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"             "${STATE_REPO}"
          git -C "${STATE_REPO}" config user.name "AIRI Architecture Research"
          git -C "${STATE_REPO}" config user.email "airi-architecture@users.noreply.github.com"
          git -C "${STATE_REPO}" fetch --quiet origin generalist-state:generalist-state
          git -C "${STATE_REPO}" checkout --quiet generalist-state
          mkdir -p "${STATE_DIR}"
          cp -a "${STATE_REPO}/generalist-state/." "${STATE_DIR}/"

          mkdir -p "${MATHESIS_ROOT}"
          if git -C "${STATE_REPO}" ls-remote --exit-code --heads origin mathesis-state >/dev/null 2>&1; then
            git -C "${STATE_REPO}" fetch --quiet origin mathesis-state:refs/remotes/origin/mathesis-state
            git -C "${STATE_REPO}" archive refs/remotes/origin/mathesis-state mathesis-state               | tar -xf - -C "${MATHESIS_ROOT}"
          fi

      - name: Ask meta-controller and build Architecture IR population
        id: plan
        run: |
          set -euo pipefail
          rm -rf "${BUNDLE}"
          mkdir -p "${BUNDLE}"

          python -m generalist_lm.architecture_search prepare             "${STATE_DIR}" "${BUNDLE}/plan.json"             --repo-root "${GITHUB_WORKSPACE}"             --mathesis-state "${MATHESIS_STATE_DIR}"             --population-size 8             --parameter-cap 7000000

          cp -a "${STATE_DIR}" "${BUNDLE}/state"
          run_search="$(jq -r '.run_search' "${BUNDLE}/plan.json")"
          matrix="$(jq -c '.matrix' "${BUNDLE}/plan.json")"
          cycle="$(jq -r '.cycle' "${BUNDLE}/plan.json")"
          base_state_sha="$(git -C "${STATE_REPO}" rev-parse HEAD)"
          {
            echo "run_search=${run_search}"
            echo "matrix=${matrix}"
            echo "cycle=${cycle}"
            echo "base_state_sha=${base_state_sha}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: architecture-plan
          path: /tmp/architecture-plan
          retention-days: 2

  stage1:
    needs: plan
    if: needs.plan.outputs.run_search == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: computer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: computer/mathesis/requirements.txt
      - run: python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: architecture-plan
          path: /tmp/plan
      - name: Static-verified proxy training
        run: |
          python -m generalist_lm.architecture_search worker             /tmp/plan/plan.json /tmp/plan/state "${GITHUB_WORKSPACE}"             "/tmp/out-${{ matrix.index }}"             --index "${{ matrix.index }}" --stage 1             --steps 4 --pretrain-steps 4 --repeat-seeds 1
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-stage1-${{ matrix.index }}
          path: /tmp/out-${{ matrix.index }}
          retention-days: 2

  reduce1:
    needs: [plan, stage1]
    if: needs.plan.outputs.run_search == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.reduce.outputs.matrix }}
    env:
      PYTHONPATH: computer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: architecture-stage1-*
          path: /tmp/results
      - id: reduce
        run: |
          python -m generalist_lm.architecture_search select             /tmp/selection.json /tmp/results --survivors 4
          echo "matrix=$(jq -c '.matrix' /tmp/selection.json)" >> "${GITHUB_OUTPUT}"

  stage2:
    needs: [plan, reduce1]
    if: needs.plan.outputs.run_search == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.reduce1.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: computer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: architecture-plan
          path: /tmp/plan
      - uses: actions/download-artifact@v4
        with:
          name: architecture-stage1-${{ matrix.index }}
          path: /tmp/previous
      - run: |
          python -m generalist_lm.architecture_search worker             /tmp/plan/plan.json /tmp/plan/state "${GITHUB_WORKSPACE}"             "/tmp/out-${{ matrix.index }}"             --index "${{ matrix.index }}" --stage 2             --steps 8 --pretrain-steps 12 --repeat-seeds 1             --source-checkpoint /tmp/previous/best-checkpoint
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-stage2-${{ matrix.index }}
          path: /tmp/out-${{ matrix.index }}
          retention-days: 2

  reduce2:
    needs: [plan, stage2]
    if: needs.plan.outputs.run_search == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.reduce.outputs.matrix }}
    env:
      PYTHONPATH: computer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: architecture-stage2-*
          path: /tmp/results
      - id: reduce
        run: |
          python -m generalist_lm.architecture_search select             /tmp/selection.json /tmp/results --survivors 2
          echo "matrix=$(jq -c '.matrix' /tmp/selection.json)" >> "${GITHUB_OUTPUT}"

  stage3:
    needs: [plan, reduce2]
    if: needs.plan.outputs.run_search == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.reduce2.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONPATH: computer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: architecture-plan
          path: /tmp/plan
      - uses: actions/download-artifact@v4
        with:
          name: architecture-stage2-${{ matrix.index }}
          path: /tmp/previous
      - run: |
          python -m generalist_lm.architecture_search worker             /tmp/plan/plan.json /tmp/plan/state "${GITHUB_WORKSPACE}"             "/tmp/out-${{ matrix.index }}"             --index "${{ matrix.index }}" --stage 3             --steps 16 --pretrain-steps 32 --repeat-seeds 2             --source-checkpoint /tmp/previous/best-checkpoint
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-stage3-${{ matrix.index }}
          path: /tmp/out-${{ matrix.index }}
          retention-days: 2

  finalize:
    needs: [plan, stage3]
    if: needs.plan.outputs.run_search == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: computer
      STATE_REPO: /tmp/airi-architecture-state-repo
      STATE_DIR: /tmp/airi-architecture-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: computer/mathesis/requirements.txt
      - run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r computer/mathesis/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: architecture-plan
          path: /tmp/plan
      - uses: actions/download-artifact@v4
        with:
          pattern: architecture-stage3-*
          path: /tmp/results

      - name: Final verifier, leaderboard and promotion
        run: |
          rm -rf "${STATE_DIR}"
          cp -a /tmp/plan/state "${STATE_DIR}"
          python -m generalist_lm.architecture_search finalize             "${STATE_DIR}" /tmp/plan/plan.json /tmp/final.json /tmp/results
          test -s "${STATE_DIR}/architecture-research/leaderboard.json"
          test -s "${STATE_DIR}/architecture-research/champion-architecture.json"

      - name: Persist verified architecture research state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "${STATE_REPO}"
          git clone --quiet             "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"             "${STATE_REPO}"
          git -C "${STATE_REPO}" config user.name "AIRI Architecture Research"
          git -C "${STATE_REPO}" config user.email "airi-architecture@users.noreply.github.com"
          git -C "${STATE_REPO}" fetch --quiet origin generalist-state:generalist-state
          git -C "${STATE_REPO}" checkout --quiet generalist-state
          current_state_sha="$(git -C "${STATE_REPO}" rev-parse HEAD)"
          expected_state_sha="${{ needs.plan.outputs.base_state_sha }}"
          if [[ "${current_state_sha}" != "${expected_state_sha}" ]]; then
            echo "generalist-state advanced during architecture research; refusing stale overwrite." >&2
            echo "expected=${expected_state_sha} current=${current_state_sha}" >&2
            exit 1
          fi
          rm -rf "${STATE_REPO}/generalist-state"
          mkdir -p "${STATE_REPO}/generalist-state"
          cp -a "${STATE_DIR}/." "${STATE_REPO}/generalist-state/"
          git -C "${STATE_REPO}" add -A generalist-state
          git -C "${STATE_REPO}" commit --allow-empty             -m "generalist-state: architecture search cycle ${{ needs.plan.outputs.cycle }}"
          git -C "${STATE_REPO}" push --quiet origin HEAD:generalist-state

      - uses: actions/upload-artifact@v4
        with:
          name: architecture-search-evidence-${{ github.run_number }}
          path: |
            /tmp/final.json
            ${{ env.STATE_DIR }}/architecture-research
          retention-days: 14

      - name: Resume normal Generalist continuum
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generalist-continuum.yml/dispatches"             -d '{"ref":"main"}'
