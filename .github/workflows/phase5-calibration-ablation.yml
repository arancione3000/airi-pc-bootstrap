name: AIRI Phase 5 Residual Calibration Ablation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'computer/generalist_lm/phase5_calibration_ablation.py'
      - '.github/workflows/phase5-calibration-ablation.yml'

permissions:
  contents: read

concurrency:
  group: airi-phase5-calibration-ablation
  cancel-in-progress: true

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: computer
      STATE_REPO: /tmp/airi-phase5-calibration-state
      STATE_DIR: /tmp/airi-phase5-calibration-state/generalist-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Clone immutable live state
        run: |
          set -euo pipefail
          rm -rf "${STATE_REPO}"
          git clone --quiet --depth 1 --branch generalist-state --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${STATE_REPO}"
          test -f "${STATE_DIR}/bootstrap-data/candidate/model.pt"
          test -f "${STATE_DIR}/bootstrap-data/progress.json"
      - name: Run residual calibration matrix
        run: |
          set -euo pipefail
          python -m generalist_lm.phase5_calibration_ablation \
            --state-dir "${STATE_DIR}" \
            --output /tmp/phase5-calibration.json \
            | tee /tmp/phase5-calibration.stdout.json
      - name: Upload calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-Phase5-Residual-Calibration-${{ github.run_number }}
          path: /tmp/phase5-calibration.json
          if-no-files-found: error
          retention-days: 7
