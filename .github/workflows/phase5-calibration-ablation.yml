name: AIRI Phase 5 Residual Calibration Ablation
# upstream-residual-matrix-v1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'computer/generalist_lm/phase5_calibration_ablation.py'
      - '.github/workflows/phase5-calibration-ablation.yml'

permissions:
  contents: read

concurrency:
  group: airi-phase5-calibration-ablation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      state_sha: ${{ steps.pin.outputs.state_sha }}
    steps:
      - name: Pin one immutable Generalist state
        id: pin
        run: |
          set -euo pipefail
          state_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/generalist-state | awk '{print $1}')"
          test -n "${state_sha}"
          echo "state_sha=${state_sha}" >> "${GITHUB_OUTPUT}"
          echo "Pinned generalist-state ${state_sha}"

  ablation:
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        policy:
          - UP_COV_B6_S8_LR3125E7_KL5
          - UP_COV_B6_S12_LR3125E7_KL10
          - UP_COV_B6_S8_LR625E7_KL10
          - UP_COV_B12_S8_LR3125E7_KL10
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: computer
      PINNED_STATE_SHA: ${{ needs.snapshot.outputs.state_sha }}
      STATE_REPO: /tmp/airi-phase5-calibration-state
      STATE_DIR: /tmp/airi-phase5-calibration-state/generalist-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Clone immutable live state
        run: |
          set -euo pipefail
          rm -rf "${STATE_REPO}"
          git clone --quiet --no-checkout --filter=blob:none \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${STATE_REPO}"
          git -C "${STATE_REPO}" fetch --quiet --depth 1 origin "${PINNED_STATE_SHA}"
          git -C "${STATE_REPO}" checkout --quiet --detach "${PINNED_STATE_SHA}"
          test -f "${STATE_DIR}/bootstrap-data/candidate/model.pt"
          test -f "${STATE_DIR}/bootstrap-data/progress.json"
      - name: Run residual calibration matrix
        run: |
          set -euo pipefail
          python -m generalist_lm.phase5_calibration_ablation \
            --state-dir "${STATE_DIR}" \
            --policy "${{ matrix.policy }}" \
            --output /tmp/phase5-calibration.json \
            | tee /tmp/phase5-calibration.stdout.json
      - name: Upload calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-Phase5-Residual-Calibration-${{ matrix.policy }}-${{ github.run_number }}
          path: /tmp/phase5-calibration.json
          if-no-files-found: error
          retention-days: 7
