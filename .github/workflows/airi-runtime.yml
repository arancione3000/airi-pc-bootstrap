name: Airi-PC runtime verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Check reconstruction scripts
        run: |
          sh -n scripts/airi-next-session
          sh -n scripts/airi-session-rebuild
          sh -n scripts/airi-rebuild

      - name: Recreate canonical workspace
        run: |
          sudo rm -rf /home/user/airi
          sudo mkdir -p /home/user
          sudo cp -a "$GITHUB_WORKSPACE" /home/user/airi
          sudo chown -R "$USER":"$USER" /home/user/airi

      - name: One-time repair of bounded browser startup
        if: github.event_name == 'workflow_dispatch'
        working-directory: /home/user/airi
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("computer/server.py")
          s = p.read_text(encoding="utf-8")
          old = r'''        launch_args = ['--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu']
        last_error = None
        modes = [False, True] if gui_available() else [True]
        for headless in modes:
            for _attempt in range(3):
'''
          new = r'''        launch_args = ['--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu']
        last_error = None
        mode = os.environ.get('AIRI_BROWSER_HEADLESS', 'auto').strip().lower()
        if mode in {'1', 'true', 'yes', 'on', 'headless'}:
            modes = [True]
        elif mode in {'0', 'false', 'no', 'off', 'headed'}:
            modes = [False] if gui_available() else [True]
        else:
            modes = [False, True] if gui_available() else [True]
        for headless in modes:
            # Bound readiness: one failed launch must not consume the full session-rebuild budget.
            for _attempt in range(1):
'''
          if old not in s:
              raise SystemExit("browser startup block not found")
          s = s.replace(old, new, 1)
          compile(s, "computer/server.py", "exec")
          p.write_text(s, encoding="utf-8")
          PY
          git config user.name "Airi-PC Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add computer/server.py
          git diff --cached --quiet || git commit -m "fix: bound browser startup during runtime readiness"
          git push origin HEAD:main

      - name: Start Airi-PC
        working-directory: /home/user/airi
        env:
          AIRI_BOOTSTRAP_SHA: ${{ github.sha }}
          AIRI_EXPECTED_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/airi-* computer/start.sh
          ./scripts/airi-session-rebuild || {
            cat /home/user/airi/logs/session-rebuild.log 2>/dev/null || true
            exit 1
          }

      - name: Canonical runtime verifier
        working-directory: /home/user/airi
        run: ./scripts/airi-runtime-verify
