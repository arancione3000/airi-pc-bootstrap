name: Build Random Reel Swiper APK

on:
  push:
    branches: [ random-reel-swiper-app ]
    paths:
      - 'android/random-reel-swiper/**'
      - '.github/workflows/random-reel-swiper-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android/random-reel-swiper
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RandomReelSwiper-debug
          path: android/random-reel-swiper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
