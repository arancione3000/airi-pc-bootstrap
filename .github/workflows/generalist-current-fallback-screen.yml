name: AIRI current fallback screen

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/generalist-current-fallback-screen.yml'
      - '.github/workflows/generalist-wide-batch-shadow.yml'
      - 'computer/generalist_lm/learning_efficiency_benchmark.py'

permissions:
  contents: read

jobs:
  fallback-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Phase-5 benchmark runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'datasets>=3.6,<5'

      - name: Screen low-LR protected recovery on current live checkpoint
        env:
          PYTHONPATH: ${{ github.workspace }}/computer
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/airi-current-fallback"
          STATE_REPO="$ROOT/state-repo"
          STATE_DIR="$STATE_REPO/generalist-state"
          mkdir -p "$ROOT"

          git clone --quiet --depth 1 --branch generalist-state --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$STATE_REPO"

          python \
            reports/generalist-learning-efficiency-v3/resume-2026-10-01/recover_pinned_corpus.py \
            --state-dir "$STATE_DIR" \
            --output-dir "$ROOT/pinned-corpus"

          TRAIN="$ROOT/pinned-corpus/pinned-train.jsonl"
          VALIDATION="$ROOT/pinned-corpus/pinned-validation.jsonl"

          python -m generalist_lm.learning_efficiency_benchmark \
            --state-dir "$STATE_DIR" \
            --output "$ROOT/low-lr.jsonl" \
            --segments 4064 \
            --seeds 7300000,7300001,7300002 \
            --threads 4 \
            --trials wide32_causal20_ar_lr05,wide32_causal20_ar_lr025,wide32_causal20_ar_lr0125 \
            --causal-documents "$TRAIN" \
            --validation-documents "$VALIDATION"

          python -m generalist_lm.learning_efficiency_benchmark \
            --state-dir "$STATE_DIR" \
            --output "$ROOT/low-lr.jsonl" \
            --summary-only

          ROOT="$ROOT" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          rows = [
              json.loads(line)
              for line in (root / "low-lr.jsonl").read_text().splitlines()
              if line.strip()
          ]
          grouped = {}
          for row in rows:
              grouped.setdefault(row["trial"]["name"], []).append(row)
          result = {}
          for name, group in grouped.items():
              result[name] = {
                  "accepted": sum(bool(r["accepted"]) for r in group),
                  "attempted": len(group),
                  "mean_repetition_after": sum(
                      r["after"]["repetition_rate"] for r in group
                  ) / len(group),
                  "mean_nll_after": sum(
                      r["after"]["language_nll"] for r in group
                  ) / len(group),
                  "mean_headroom_after": sum(
                      r["headroom_after"] for r in group
                  ) / len(group),
                  "mean_accepted_h": sum(
                      r["accepted_equivalent_tokens_per_hour"] for r in group
                  ) / len(group),
              }
          (root / "low-lr-comparison.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print("LOW_LR_CURRENT_COMPARISON")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload fallback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-current-fallback-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/airi-current-fallback/low-lr.jsonl
            ${{ runner.temp }}/airi-current-fallback/low-lr.summary.json
            ${{ runner.temp }}/airi-current-fallback/low-lr-comparison.json
          if-no-files-found: warn
          retention-days: 14
