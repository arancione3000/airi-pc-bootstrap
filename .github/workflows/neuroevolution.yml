name: NeuroEvolution verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'computer/evolution/**'
      - 'computer/server.py'
      - 'computer/advanced.py'
      - 'computer/control_plane/orchestrator.py'
      - 'tests/test_evolution_*.py'
      - 'tests/test_advanced.py'
      - '.ai/skills/evolution-lab/**'
      - '.ai/skills/neuroevolution/**'
      - '.github/workflows/neuroevolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build focused test environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check pytest
          .venv/bin/pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu

      - name: Compile evolution and integration sources
        run: |
          .venv/bin/python -m compileall -q computer/evolution computer/server.py computer/advanced.py computer/control_plane/orchestrator.py tests/test_evolution_engine.py tests/test_evolution_pipeline.py tests/test_evolution_integration.py tests/test_evolution_lab.py tests/test_evolution_persistence.py

      - name: Focused evolution tests
        run: |
          .venv/bin/python -m pytest -q tests/test_evolution_engine.py tests/test_evolution_pipeline.py tests/test_evolution_integration.py tests/test_evolution_lab.py tests/test_evolution_persistence.py tests/test_advanced.py

      - name: Persistent daemon survives launcher exit and persists to Git
        env:
          PYTHONPATH: ${{ github.workspace }}/computer
        run: |
          set -eu
          BASE="$RUNNER_TEMP/airi-daemon-smoke"
          REMOTE="$RUNNER_TEMP/airi-evolution-remote.git"
          SEED="$RUNNER_TEMP/airi-evolution-seed"
          rm -rf "$BASE" "$REMOTE" "$SEED"
          mkdir -p "$BASE"
          git init --bare -q "$REMOTE"
          git init -q "$SEED"
          git -C "$SEED" config user.name Test
          git -C "$SEED" config user.email test@example.com
          mkdir -p "$SEED/evolution-state/shadow-router"
          printf '%s\n' '{"version":1,"feature_schema":2,"exported_at":0,"state_digest":"","files":{},"privacy":{"raw_observations_exported":false,"goal_text_exported":false,"argument_values_exported":false,"dataset_audit":{"ok":true,"records":0,"errors":[]}}}' > "$SEED/evolution-state/shadow-router/manifest.json"
          git -C "$SEED" add evolution-state
          git -C "$SEED" commit -qm seed
          git -C "$SEED" branch -M airi-evolution-state
          git -C "$SEED" remote add origin "$REMOTE"
          git -C "$SEED" push -q -u origin airi-evolution-state
          BEFORE="$(git --git-dir="$REMOTE" rev-parse refs/heads/airi-evolution-state)"

          sh -c 'nohup env             PYTHONPATH="'"$GITHUB_WORKSPACE"'/computer"             AIRI_ROOT="'"$BASE"'"             AIRI_EVOLUTION_LAB_STATE="'"$BASE"'/.ai/evolution-lab/shadow-router"             AIRI_EVOLUTION_SYNC_DIR="'"$BASE"'/.ai/evolution-git"             AIRI_EVOLUTION_GIT_URL="'"$REMOTE"'"             AIRI_EVOLUTION_DAEMON_INTERVAL=60             AIRI_EVOLUTION_SYNC_INTERVAL=900             AIRI_EVOLUTION_HEARTBEAT_SECONDS=1800             .venv/bin/python -m evolution.daemon             >"'"$BASE"'/daemon.log" 2>&1 < /dev/null &'

          for _ in $(seq 1 20); do
            [ -f "$BASE/.ai/evolution-lab/shadow-router/daemon.pid" ] && break
            sleep 0.5
          done
          PID="$(cat "$BASE/.ai/evolution-lab/shadow-router/daemon.pid")"
          kill -0 "$PID"

          sleep 60 &
          SESSION_PID=$!
          kill "$SESSION_PID" 2>/dev/null || true
          wait "$SESSION_PID" 2>/dev/null || true
          kill -0 "$PID"

          CHANGED=0
          for _ in $(seq 1 30); do
            AFTER="$(git --git-dir="$REMOTE" rev-parse refs/heads/airi-evolution-state)"
            if [ "$AFTER" != "$BEFORE" ]; then CHANGED=1; break; fi
            sleep 1
          done
          [ "$CHANGED" = "1" ] || { cat "$BASE/daemon.log"; exit 7; }
          kill -TERM "$PID"
          for _ in $(seq 1 20); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 0.2
          done
          echo "daemon survived launcher/session exit and persisted state"

      - name: PyTorch end-to-end evolution smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/computer
        run: |
          .venv/bin/python - <<'PY'
          import json, tempfile, torch
          from pathlib import Path
          from evolution.data import append_verified
          from evolution.engine import EvolutionConfig, run_evolution, predict_text
          from evolution.edge import quantize_champion
          from evolution.audit import audit_state

          state=Path(tempfile.mkdtemp(prefix='airi-evo-ci-'))
          data=state/'data'/'verified.jsonl'
          for i in range(24):
              append_verified(data, {'text':f'official audited evidence confirms report number {i}', 'label':1, 'source':'ci'})
              append_verified(data, {'text':f'fabricated viral hoax debunked as false number {i}', 'label':0, 'source':'ci'})
          cfg=EvolutionConfig.for_mode(
              'safe', population=4, generations=1, candidate_epochs=1,
              finalist_epochs=1, promotion_repeats=2, min_promotion_votes=1,
              min_f1_first_champion=0.0, min_first_canary_f1=0.0,
              max_params=5_000_000, max_latency_ms=1000.0,
          )
          result=run_evolution(state,cfg)
          assert result['ok'] is True
          assert len(result['promotion_trials']) == 2
          assert result['canary']['records'] >= 4
          assert result['promoted'] is True
          selected=result['candidate']['selected_trial']
          champion_state=torch.load(state/'champion'/'model.pt',map_location='cpu',weights_only=True)
          trial_state=torch.load(Path(result['run_dir'])/'selected-trial.pt',map_location='cpu',weights_only=True)
          assert result['candidate']['selected_trial_path'].endswith('selected-trial.pt')
          assert not list(Path(result['run_dir']).glob('promotion-trial-*.pt'))
          assert champion_state.keys() == trial_state.keys()
          assert all(torch.equal(champion_state[k], trial_state[k]) for k in champion_state)
          if result['promoted']:
              pred=predict_text(state,'fabricated viral hoax debunked as false')
              assert pred['label'] in {'likely_fake','likely_real','uncertain'}
              edge=quantize_champion(state,max_samples=16)
              assert edge['ok'] is True
              assert edge['metrics']['samples'] >= 4
              assert (state/'edge'/'attempt.json').exists()
              assert 0.0 <= edge['metrics']['label_agreement'] <= 1.0
          audit=audit_state(state)
          assert audit['ok'] is True, audit
          print(json.dumps({'ok':True,'promoted':result['promoted'],'candidate':result['candidate']},indent=2))
          PY


      - name: Shadow Evolution Lab sandbox smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/computer
          AIRI_ROOT: ${{ runner.temp }}/airi-shadow-root
          AIRI_EVOLUTION_LAB_STATE: ${{ runner.temp }}/airi-shadow-root/.ai/evolution-lab/shadow-router
          AIRI_LAB_POPULATION: "4"
          AIRI_LAB_GENERATIONS: "1"
          AIRI_LAB_CANDIDATE_EPOCHS: "1"
          AIRI_LAB_FINALIST_EPOCHS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mkdir -p "$AIRI_ROOT"
          .venv/bin/python - <<'PY'
          from evolution import lab

          goals = [
              "tiny task",
              "read a medium document with several words for analysis",
              "line one\nline two\nline three",
              "inspect https://example.invalid/resource",
              "inspect /tmp/example/path/file.txt safely",
              "numbers 12 345 6789 mixed into a structured request",
              "word " * 35,
              "word " * 90,
          ]
          arg_variants = [
              {"x": 1},
              {"x": "value", "y": 2},
              {"x": True, "y": []},
              {"x": {}, "y": None, "z": 1.5},
              {"x": [1,2,3]},
              {"x": "v", "y": "w", "z": "q"},
              {"x": 1, "y": 2, "z": 3, "w": 4},
              {},
          ]
          candidate_variants = [
              ["computer_file_read"],
              ["computer_file_read","computer_browser_text"],
              ["computer_file_read","computer_file_search"],
              ["computer_file_read","computer_project_analyze"],
              ["computer_browser_open"],
              ["computer_browser_open","computer_research"],
              ["computer_browser_open","computer_browser_text"],
              ["computer_browser_open","computer_project_analyze"],
          ]

          for i in range(24):
              k=i % len(goals)
              lab.record_execution(
                  goal=goals[k],
                  operation="read",
                  tool="computer_file_read",
                  args=arg_variants[k],
                  success=True,
                  latency_ms=20 + k,
                  task_id=f"s{i}",
                  node_id="n1",
                  candidates=candidate_variants[k],
              )
              lab.record_execution(
                  goal=goals[(k+3) % len(goals)],
                  operation="browser_open",
                  tool="computer_browser_open",
                  args=arg_variants[(k+5) % len(arg_variants)],
                  success=False,
                  latency_ms=900 + k,
                  error="network connection failed",
                  task_id=f"f{i}",
                  node_id="n1",
                  candidates=candidate_variants[(k+4) % len(candidate_variants)],
              )
          st=lab.status()
          assert st["raw_observations"] == 48, st
          assert st["unique_route_features"] >= 12, st
          raw=lab.RAW.read_text(encoding="utf-8")
          assert "example.invalid" not in raw
          assert "/tmp/example/path" not in raw
          PY

          .venv/bin/python -m evolution.lab_worker

          .venv/bin/python - <<'PY'
          from evolution import lab
          st=lab.status()
          assert st["training_records"] == 48, st
          assert st["last_cycle"] is not None, st
          assert st["last_cycle"].get("run_id"), st
          assert st["last_cycle"].get("candidate") is not None, st
          assert isinstance(st["last_cycle"].get("promoted"), bool), st
          assert st["last_cycle"].get("promotion_reason"), st
          assert st["champion_compatible"] is True, st
          # A weak synthetic candidate may be rejected by the real promotion gate.
          # That is a successful safety outcome, not a training failure.
          print({"lab_status":st})
          PY

          .venv/bin/python - <<'PY'
          import os, socket
          from pathlib import Path
          from evolution.lab_worker import install_sandbox_guard
          root=Path(os.environ["AIRI_EVOLUTION_LAB_STATE"]).resolve()
          root.mkdir(parents=True,exist_ok=True)
          install_sandbox_guard(root)

          try:
              socket.getaddrinfo("example.com",443)
          except PermissionError:
              pass
          else:
              raise AssertionError("sandbox allowed DNS/network resolution")

          try:
              Path(os.environ["AIRI_ROOT"]).parent.joinpath("escape.txt").write_text("bad")
          except PermissionError:
              pass
          else:
              raise AssertionError("sandbox allowed write outside lab root")
          print("sandbox guard blocked network and external writes")
          PY
