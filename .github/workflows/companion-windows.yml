name: Airi-PC Companion Windows
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    tags: ['companion-v*']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: airi-pc-companion
    steps:
      - uses: actions/checkout@v4
      - name: Build portable EXE
        shell: pwsh
        run: ./installer/build_windows.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\AiriPC-Companion.iss"'
      - name: Archive portable
        shell: pwsh
        run: Compress-Archive -Path dist/AiriPC-Companion -DestinationPath AiriPC-Companion-portable-windows.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/companion-v')
        shell: pwsh
        run: |
          gh release create "${env:GITHUB_REF_NAME}" `
            "dist/installer/AiriPC-Companion-Setup.exe" `
            "AiriPC-Companion-portable-windows.zip" `
            --title "Airi-PC Companion ${env:GITHUB_REF_NAME}" `
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: AiriPC-Companion-windows
          path: |
            airi-pc-companion/dist/AiriPC-Companion-portable-windows.zip
            airi-pc-companion/dist/installer/AiriPC-Companion-Setup.exe
