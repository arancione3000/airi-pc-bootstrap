name: AIRI Generalist Mobile Export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'computer/generalist_lm/mobile_export.py'
      - 'computer/generalist_lm/generalist_swarm.py'
      - '.github/workflows/generalist-mobile-export.yml'
  workflow_run:
    workflows: ['AIRI Generalist Research Continuum']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: airi-generalist-mobile-export
  cancel-in-progress: true

jobs:
  export:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: computer
      STATE_ROOT: /tmp/airi-generalist-mobile-state
      MOBILE_OUT: /tmp/airi-generalist-mobile-bundle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: computer/mathesis/requirements.txt

      - name: Install ONNX export runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'onnx>=1.17,<2' 'onnxruntime>=1.22,<2'

      - name: Restore latest persistent Generalist state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "${STATE_ROOT}"
          git clone --quiet --branch generalist-state --single-branch             "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"             "${STATE_ROOT}"
          STATE_SHA="$(git -C "${STATE_ROOT}" rev-parse HEAD)"
          echo "STATE_SHA=${STATE_SHA}" >> "${GITHUB_ENV}"
          test -f "${STATE_ROOT}/generalist-state/champion/model.pt"
          test -f "${STATE_ROOT}/generalist-state/status.json"

      - name: Export and independently validate mobile ONNX bundle
        run: |
          set -euo pipefail
          rm -rf "${MOBILE_OUT}"
          python -m generalist_lm.mobile_export             --state-dir "${STATE_ROOT}/generalist-state"             --output "${MOBILE_OUT}"             --state-sha "${STATE_SHA}"
          test -s "${MOBILE_OUT}/manifest.json"
          test -s "${MOBILE_OUT}/champion/model.onnx"
          jq -e '.schema == 1 and .slots.champion.files["model.onnx"].bytes > 0'             "${MOBILE_OUT}/manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: AIRI-Generalist-Mobile-Bundle
          path: /tmp/airi-generalist-mobile-bundle
          retention-days: 7

      - name: Publish latest mobile bundle branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUBLISH=/tmp/airi-generalist-mobile-publish
          rm -rf "${PUBLISH}"
          git clone --quiet             "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"             "${PUBLISH}"
          cd "${PUBLISH}"
          git config user.name "AIRI Generalist Mobile Export"
          git config user.email "airi-generalist-mobile@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin generalist-mobile >/dev/null 2>&1; then
            git fetch --quiet origin generalist-mobile:generalist-mobile
            git checkout --quiet generalist-mobile
          else
            git checkout --orphan generalist-mobile
            git rm -rf . >/dev/null 2>&1 || true
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "${MOBILE_OUT}/." .
          git add -A
          git commit --allow-empty -m "generalist-mobile: state ${STATE_SHA}"
          git push --quiet origin HEAD:generalist-mobile
