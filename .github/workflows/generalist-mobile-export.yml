name: AIRI Generalist Mobile Export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'computer/generalist_lm/mobile_export.py'
      - 'computer/generalist_lm/model.py'
      - 'computer/generalist_lm/architecture_*.py'
      - 'computer/generalist_lm/generalist_swarm.py'
      - '.github/workflows/generalist-mobile-export.yml'
  pull_request:
    paths:
      - 'computer/generalist_lm/mobile_export.py'
      - 'computer/generalist_lm/model.py'
      - 'computer/generalist_lm/architecture_*.py'
      - 'computer/generalist_lm/generalist_swarm.py'
      - '.github/workflows/generalist-mobile-export.yml'
  workflow_run:
    workflows: ['AIRI Generalist Research Continuum', 'AIRI Generalist Language Bootstrap', 'AIRI Generalist Architecture Search']
    types: [completed]

permissions:
  contents: write

concurrency:
  # Pull-request validation must not be cancelled by autonomous H24 exports.
  # Publication runs still collapse to the newest state, while each PR keeps
  # its own stable verification lock.
  group: airi-generalist-mobile-export-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: true

jobs:
  export:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: computer
      STATE_ROOT: /tmp/airi-generalist-mobile-state
      MOBILE_OUT: /tmp/airi-generalist-mobile-bundle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: computer/mathesis/requirements.txt

      - name: Install ONNX export runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'onnx>=1.17,<2' 'onnxruntime>=1.22,<2' 'onnxscript>=0.5,<1'

      - name: Synthetic evolved-architecture ONNX smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          import numpy as np
          import onnxruntime as ort
          import torch

          from generalist_lm.model import CausalTransformerLM, GeneralistLMConfig

          configs = {
              "baseline": GeneralistLMConfig(
                  vocab_size=384,
                  context_length=64,
                  d_model=64,
                  n_heads=4,
                  n_layers=2,
                  d_ff=128,
                  tokenizer_version="bpe-v1",
                  norm_type="rmsnorm",
                  norm_placement="post",
                  position_encoding="rope",
                  ff_variant="swiglu",
                  attention_type="gqa",
                  n_kv_heads=2,
                  local_attention_window=24,
                  local_attention_every=2,
                  tie_embeddings=False,
              ).validate(),
              "recurrent": GeneralistLMConfig(
                  vocab_size=384,
                  context_length=64,
                  d_model=64,
                  n_heads=4,
                  n_layers=2,
                  d_ff=128,
                  tokenizer_version="bpe-v1",
                  norm_type="rmsnorm",
                  position_encoding="rope",
                  ff_variant="swiglu",
                  attention_type="gqa",
                  n_kv_heads=2,
                  recurrent_depth=2,
              ).validate(),
              "moe": GeneralistLMConfig(
                  vocab_size=384,
                  context_length=64,
                  d_model=64,
                  n_heads=4,
                  n_layers=2,
                  d_ff=96,
                  tokenizer_version="bpe-v1",
                  norm_type="rmsnorm",
                  position_encoding="rope",
                  ff_variant="moe_swiglu",
                  attention_type="gqa",
                  n_kv_heads=2,
                  moe_experts=4,
                  moe_top_k=1,
              ).validate(),
          }

          class NextToken(torch.nn.Module):
              def __init__(self, inner):
                  super().__init__()
                  self.inner = inner

              def forward(self, input_ids):
                  return self.inner(input_ids, use_cache=False)["logits"][:, -1, :]

          sample = torch.tensor([[1, 4, 5, 6]], dtype=torch.long)
          dynamic_probe = torch.tensor([[1, 4, 5, 6, 7, 8]], dtype=torch.long)
          for name, cfg in configs.items():
              torch.manual_seed(1234)
              model = CausalTransformerLM(cfg).eval()
              wrapper = NextToken(model).eval()
              path = f"/tmp/airi-{name}-smoke.onnx"
              torch.onnx.export(
                  wrapper,
                  (sample,),
                  path,
                  input_names=["input_ids"],
                  output_names=["logits"],
                  dynamic_axes={"input_ids": {1: "sequence"}},
                  opset_version=18,
                  dynamo=True,
                  external_data=False,
              )
              session = ort.InferenceSession(path, providers=["CPUExecutionProvider"])
              max_error = 0.0
              for probe in (sample, dynamic_probe):
                  with torch.no_grad():
                      reference = wrapper(probe).cpu().numpy()
                  actual = session.run(
                      None,
                      {"input_ids": probe.cpu().numpy().astype(np.int64)},
                  )[0]
                  error = float(np.max(np.abs(reference - actual)))
                  max_error = max(max_error, error)
                  assert np.isfinite(error) and error <= 5e-4, (name, error)
              print({
                  "AIRI_EVOLVED_ONNX": "PASS",
                  "architecture": name,
                  "max_abs_error": max_error,
              })
          PY

      - name: Restore latest persistent Generalist state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "${STATE_ROOT}"
          git clone --quiet --branch generalist-state --single-branch             "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"             "${STATE_ROOT}"
          STATE_SHA="$(git -C "${STATE_ROOT}" rev-parse HEAD)"
          echo "STATE_SHA=${STATE_SHA}" >> "${GITHUB_ENV}"
          test -f "${STATE_ROOT}/generalist-state/champion/model.pt"
          test -f "${STATE_ROOT}/generalist-state/status.json"

      - name: Bind Latest Research to the live Phase-5 lineage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          from generalist_lm.model import parameter_count
          from generalist_lm.runtime import GeneralistRuntime

          state = Path("/tmp/airi-generalist-mobile-state/generalist-state")
          candidate = state / "bootstrap-data" / "candidate"
          progress_path = state / "bootstrap-data" / "progress.json"
          report_path = state / "bootstrap-data" / "report.json"

          # Mobile "Latest Research" is the exact persisted Phase-5 checkpoint
          # that the language bootstrap resumes and grows.  This preparation
          # mutates only the temporary export checkout, never generalist-state.
          if not (candidate / "model.pt").is_file():
              raise SystemExit("live Phase-5 candidate checkpoint is missing")
          if not progress_path.is_file():
              raise SystemExit("live Phase-5 progress is missing")

          progress = json.loads(progress_path.read_text(encoding="utf-8"))
          status = json.loads((state / "status.json").read_text(encoding="utf-8"))
          report = {}
          if report_path.is_file():
              raw = json.loads(report_path.read_text(encoding="utf-8"))
              if int(raw.get("target_tokens", -1) or -1) == int(
                  progress.get("target_tokens", -2) or -2
              ):
                  report = raw

          runtime = GeneralistRuntime.from_checkpoint(candidate, device="cpu")
          parameters = int(parameter_count(runtime.model))
          target_tokens = int(progress.get("target_tokens", 0) or 0)
          tokens_processed = int(progress.get("tokens_processed", 0) or 0)

          latest = state / "latest-research"
          shutil.rmtree(latest, ignore_errors=True)
          shutil.copytree(candidate, latest)

          after = report.get("after") if isinstance(report, dict) else None
          language_nll = None
          if isinstance(after, dict):
              try:
                  candidate_nll = float(after.get("language_nll"))
                  if __import__("math").isfinite(candidate_nll):
                      language_nll = candidate_nll
              except (TypeError, ValueError):
                  pass

          # mobile_export's ranking profile historically uses +infinity for
          # missing NLL/domain-regression metrics.  JSON itself does not allow
          # Infinity, and Android parsers may reject that manifest.  Emit a
          # finite sentinel only when a current-rung measurement is genuinely
          # unavailable, and say so explicitly.
          nll_per_byte = language_nll if language_nll is not None else 1_000_000.0
          nll_available = language_nll is not None
          try:
              measured_regression = float(report.get("worst_domain_regression"))
              regression_available = __import__("math").isfinite(measured_regression)
          except (TypeError, ValueError):
              measured_regression = 1_000_000.0
              regression_available = False
          if not regression_available:
              measured_regression = 1_000_000.0

          summary = {
              "candidate_id": f"phase5-live-{target_tokens}-{tokens_processed}",
              "kind": "language_bootstrap_live",
              "cycle": int(status.get("cycle", 0) or 0),
              "stage": 5,
              "parameters": parameters,
              "target_tokens": target_tokens,
              "tokens_processed": tokens_processed,
              "rung_complete": bool(progress.get("rung_complete")),
              "research_only": True,
              "all_seed_eligible": False,
              "external_pretrained": False,
              "mobile_binding": "exact_bootstrap_data_candidate",
              "score": float(report.get("score", 0.0) or 0.0),
              "nll_per_byte": float(nll_per_byte),
              "nll_per_byte_available": bool(nll_available),
              "worst_domain_regression": float(measured_regression),
              "worst_domain_regression_available": bool(regression_available),
          }

          metrics = {
              "target_tokens": target_tokens,
              "tokens_processed": tokens_processed,
              "rung_complete": bool(progress.get("rung_complete")),
              "parameters": parameters,
              "research_source": "bootstrap-data/candidate",
              "nll_per_byte": float(nll_per_byte),
              "nll_per_byte_available": bool(nll_available),
          }
          if isinstance(after, dict):
              metrics.update({
                  "generation_pathological_repetition": bool(
                      after.get("pathological_repetition", True)
                  ),
                  "generation_repetition_rate": float(
                      after.get("repetition_rate", 1.0) or 1.0
                  ),
                  "generation_similarity": float(
                      after.get("generation_similarity", 0.0) or 0.0
                  ),
                  "generation_nonempty_rate": float(
                      after.get("non_empty_rate", 0.0) or 0.0
                  ),
              })

          (latest / "research-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (latest / "research-metrics.json").write_text(
              json.dumps(metrics, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          # The app's research slot must not silently switch to an unrelated
          # architecture incumbent.  Remove it only in this throw-away clone.
          shutil.rmtree(
              state / "architecture-research" / "incumbent",
              ignore_errors=True,
          )

          print(json.dumps({
              "ok": True,
              "candidate_id": summary["candidate_id"],
              "parameters": parameters,
              "target_tokens": target_tokens,
              "tokens_processed": tokens_processed,
              "tokenizer_version": runtime.tokenizer.version,
              "tokenizer_vocab_size": runtime.tokenizer.vocab_size,
          }, sort_keys=True))
          PY

      - name: Export and independently validate mobile ONNX bundle
        run: |
          set -euo pipefail
          rm -rf "${MOBILE_OUT}"
          python -m generalist_lm.mobile_export             --state-dir "${STATE_ROOT}/generalist-state"             --output "${MOBILE_OUT}"             --state-sha "${STATE_SHA}"
          test -s "${MOBILE_OUT}/manifest.json"
          test -s "${MOBILE_OUT}/champion/model.onnx"
          jq -e '
            .schema == 1
            and .slots.champion.files["model.onnx"].bytes > 0
            and .slots.research.files["model.onnx"].bytes > 0
            and (.slots.research.id | startswith("phase5-live-"))
            and .slots.research.research_source == "latest-research"
          ' "${MOBILE_OUT}/manifest.json"
          jq -e '.role == "phase5_language_bootstrap_candidate"' \
            "${MOBILE_OUT}/research/metadata.json"
          python - <<'PY'
          import json
          from pathlib import Path

          def reject_constant(value):
              raise ValueError(f"non-standard JSON constant in mobile manifest: {value}")

          manifest = json.loads(
              Path("/tmp/airi-generalist-mobile-bundle/manifest.json").read_text(
                  encoding="utf-8"
              ),
              parse_constant=reject_constant,
          )
          research = manifest["slots"]["research"]
          assert research["id"].startswith("phase5-live-")
          assert research["parameters"] > 0
          PY
          if grep -Eq 'Infinity|NaN' "${MOBILE_OUT}/manifest.json"; then
            echo "Mobile manifest contains a non-finite numeric literal." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AIRI-Generalist-Mobile-Bundle
          path: /tmp/airi-generalist-mobile-bundle
          retention-days: 7

      - name: Publish latest mobile bundle branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUBLISH=/tmp/airi-generalist-mobile-publish
          rm -rf "${PUBLISH}"
          git clone --quiet             "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"             "${PUBLISH}"
          cd "${PUBLISH}"
          git config user.name "AIRI Generalist Mobile Export"
          git config user.email "airi-generalist-mobile@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin generalist-mobile >/dev/null 2>&1; then
            git fetch --quiet origin generalist-mobile:generalist-mobile
            git checkout --quiet generalist-mobile
          else
            git checkout --orphan generalist-mobile
            git rm -rf . >/dev/null 2>&1 || true
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "${MOBILE_OUT}/." .
          git add -A
          git commit --allow-empty -m "generalist-mobile: state ${STATE_SHA}"
          git push --quiet origin HEAD:generalist-mobile
