name: AIRI Generalist 7M Training Benchmark

on:
  pull_request:
    paths:
      - '.github/workflows/generalist-7m-training-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: computer
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU PyTorch
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu

      - name: Benchmark exact AIRI 7M training shape
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/airi-7m-training-benchmark.json
          import copy
          import json
          import math
          import time

          import torch

          from generalist_lm.model import CausalTransformerLM, GeneralistLMConfig, parameter_count
          from generalist_lm.training import causal_training_objective

          torch.manual_seed(12345)
          torch.set_num_threads(4)
          try:
              torch.set_num_interop_threads(1)
          except RuntimeError:
              pass

          cfg = GeneralistLMConfig(
              vocab_size=384,
              context_length=128,
              d_model=96,
              n_heads=4,
              n_layers=12,
              d_ff=1888,
              dropout=0.0,
              tokenizer_version='bpe-v1',
              norm_type='layernorm',
              position_encoding='learned',
              ff_variant='swiglu',
              attention_type='mha',
              norm_placement='pre',
              tie_embeddings=True,
          ).validate()

          seed_model = CausalTransformerLM(cfg).cpu()
          base_state = copy.deepcopy(seed_model.state_dict())
          params = parameter_count(seed_model)
          assert 6_800_000 <= params <= 7_200_000, params

          def one_variant(batch_size: int, precision: str, compiled: bool):
              model = CausalTransformerLM(cfg).cpu()
              model.load_state_dict(base_state)
              if compiled:
                  try:
                      model = torch.compile(model, mode='reduce-overhead', fullgraph=False)
                  except Exception as exc:
                      return {
                          'batch_size': batch_size,
                          'precision': precision,
                          'compiled': compiled,
                          'ok': False,
                          'error': f'compile setup failed: {type(exc).__name__}: {exc}',
                      }

              opt = torch.optim.AdamW(model.parameters(), lr=3e-4, weight_decay=0.01)
              g = torch.Generator(device='cpu')
              g.manual_seed(9000 + batch_size)
              ids = torch.randint(
                  low=8,
                  high=cfg.vocab_size,
                  size=(batch_size, cfg.context_length),
                  generator=g,
                  dtype=torch.long,
              )
              labels = ids.clone()

              autocast = precision == 'bf16'
              def step():
                  opt.zero_grad(set_to_none=True)
                  with torch.autocast(
                      device_type='cpu',
                      dtype=torch.bfloat16,
                      enabled=autocast,
                  ):
                      result = model(ids)
                      loss, _stats = causal_training_objective(
                          result['logits'],
                          labels,
                          ids,
                          eos_loss_weight=1.6,
                          repetition_unlikelihood_weight=0.05,
                          repetition_window=16,
                      )
                  if not torch.isfinite(loss):
                      raise RuntimeError('non-finite benchmark loss')
                  loss.backward()
                  torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)
                  opt.step()
                  return float(loss.detach())

              compile_start = time.perf_counter()
              try:
                  warm_loss = step()
              except Exception as exc:
                  return {
                      'batch_size': batch_size,
                      'precision': precision,
                      'compiled': compiled,
                      'ok': False,
                      'error': f'warmup failed: {type(exc).__name__}: {exc}',
                  }
              warmup_seconds = time.perf_counter() - compile_start

              # One extra warmup after compilation/autocast setup, then three
              # measured optimizer steps. This is short enough for CI but uses
              # the exact 7M shape, context and training objective.
              step()
              measured = []
              losses = []
              for _ in range(3):
                  start = time.perf_counter()
                  losses.append(step())
                  measured.append(time.perf_counter() - start)

              median_s = sorted(measured)[len(measured)//2]
              raw_tokens = batch_size * cfg.context_length
              return {
                  'batch_size': batch_size,
                  'precision': precision,
                  'compiled': compiled,
                  'ok': True,
                  'warmup_seconds': warmup_seconds,
                  'median_step_seconds': median_s,
                  'raw_tokens_per_second': raw_tokens / median_s,
                  'mean_loss': sum(losses) / len(losses),
                  'warm_loss': warm_loss,
              }

          variants = []
          for batch in (16, 32, 64):
              variants.append(one_variant(batch, 'fp32', False))
          for batch in (32, 64):
              variants.append(one_variant(batch, 'bf16', False))
          # Compile only the current production batch first; if it wins, the
          # result justifies a separate guarded rollout without guessing.
          variants.append(one_variant(32, 'fp32', True))
          variants.append(one_variant(32, 'bf16', True))

          successful = [row for row in variants if row.get('ok')]
          if not successful:
              raise SystemExit('all benchmark variants failed')
          winner = max(successful, key=lambda row: row['raw_tokens_per_second'])

          payload = {
              'ok': True,
              'schema': 1,
              'model_parameters': params,
              'config': cfg.to_dict(),
              'torch_version': torch.__version__,
              'cpu_threads': torch.get_num_threads(),
              'variants': variants,
              'winner': winner,
              'production_baseline': next(
                  row for row in successful
                  if row['batch_size'] == 32
                  and row['precision'] == 'fp32'
                  and row['compiled'] is False
              ),
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: airi-generalist-7m-training-benchmark
          path: /tmp/airi-7m-training-benchmark.json
          retention-days: 7
