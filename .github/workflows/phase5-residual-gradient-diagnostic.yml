name: AIRI Phase 5 Residual Gradient Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'computer/generalist_lm/phase5_residual_gradient_diagnostic.py'
      - '.github/workflows/phase5-residual-gradient-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airi-phase5-residual-gradient-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: computer
      STATE_REPO: /tmp/airi-phase5-residual-gradient-state
      STATE_DIR: /tmp/airi-phase5-residual-gradient-state/generalist-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Clone immutable live state
        run: |
          set -euo pipefail
          rm -rf "${STATE_REPO}"
          git clone --quiet --depth 1 --branch generalist-state --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${STATE_REPO}"
          test -f "${STATE_DIR}/bootstrap-data/candidate/model.pt"
      - name: Measure residual objective gradients
        run: |
          python -m generalist_lm.phase5_residual_gradient_diagnostic \
            --state-dir "${STATE_DIR}" \
            --output /tmp/phase5-residual-gradient.json \
            | tee /tmp/phase5-residual-gradient.stdout.json
      - uses: actions/upload-artifact@v4
        with:
          name: AIRI-Phase5-Residual-Gradient-${{ github.run_number }}
          path: /tmp/phase5-residual-gradient.json
          if-no-files-found: error
          retention-days: 7
