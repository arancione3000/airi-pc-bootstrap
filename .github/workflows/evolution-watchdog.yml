name: Airi Evolution Watchdog

on:
  workflow_dispatch:
  schedule:
    # Independent lightweight checks twice per hour. The main evolution job
    # normally runs hourly; this only dispatches recovery when its heartbeat
    # is stale, so missed/delayed GitHub cron slots do not leave evolution idle.
    - cron: '8,38 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/evolution-watchdog.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: airi-evolution-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check evolution heartbeat age
        id: heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_SECONDS: '4200'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/airi-evolution-state"

          if ! payload="$(curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"; then
            echo "stale=true" >> "${GITHUB_OUTPUT}"
            echo "reason=state_branch_lookup_failed" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          last_sync="$(jq -r '.commit.commit.committer.date // .commit.commit.author.date // empty' <<<"${payload}")"
          if [[ -z "${last_sync}" ]]; then
            echo "stale=true" >> "${GITHUB_OUTPUT}"
            echo "reason=missing_state_timestamp" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          sync_epoch="$(date -u -d "${last_sync}" +%s)"
          age_seconds="$((now_epoch - sync_epoch))"
          if (( age_seconds < 0 )); then
            age_seconds=0
          fi

          echo "last_sync=${last_sync}" >> "${GITHUB_OUTPUT}"
          echo "age_seconds=${age_seconds}" >> "${GITHUB_OUTPUT}"

          if (( age_seconds > MAX_AGE_SECONDS )); then
            echo "stale=true" >> "${GITHUB_OUTPUT}"
            echo "reason=heartbeat_older_than_70_minutes" >> "${GITHUB_OUTPUT}"
          else
            echo "stale=false" >> "${GITHUB_OUTPUT}"
            echo "reason=heartbeat_fresh" >> "${GITHUB_OUTPUT}"
          fi

          echo "Evolution state last synced at ${last_sync}; age=${age_seconds}s"

      - name: Dispatch recovery evolution cycle
        if: steps.heartbeat.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Heartbeat stale (${{ steps.heartbeat.outputs.reason }}). Dispatching recovery cycle."
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/evolution-continuum.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Healthy heartbeat
        if: steps.heartbeat.outputs.stale != 'true'
        run: |
          echo "Evolution heartbeat is healthy; no recovery run required."
