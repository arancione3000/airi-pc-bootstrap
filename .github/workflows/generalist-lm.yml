name: AIRI Generalist LM verification

on:
  push:
    branches: [main]
    paths:
      - 'computer/generalist_lm/**'
      - 'tests/test_generalist_lm.py'
      - 'tests/test_generalist_scalable_learning.py'
      - 'tests/test_generalist_grounded_learning.py'
      - 'tests/test_generalist_bpe.py'
      - 'tests/test_generalist_bpe_evolution.py'
      - 'tests/test_generalist_retention.py'
      - 'tests/test_generalist_provider.py'
      - 'tests/test_generalist_foundation.py'
      - 'tests/test_generalist_phase5.py'
      - 'tests/test_generalist_architecture.py'
      - 'tests/test_generalist_single_lineage.py'
      - 'tests/test_generalist_efficiency_engine.py'
      - 'tests/test_generalist_learning_efficiency.py'
      - '.github/workflows/generalist-architecture-search.yml'
      - '.github/workflows/generalist-incumbent-recovery.yml'
      - '.github/workflows/generalist-state-writer-janitor.yml'
      - '.github/workflows/generalist-bootstrap.yml'
      - 'tests/test_native_foundation.py'
      - 'tests/test_native_training.py'
      - 'tests/test_native_acquisition.py'
      - 'tests/test_native_evolution.py'
      - '.github/workflows/native-evolution.yml'
      - 'computer/control_plane/generalist_provider.py'
      - 'computer/control_plane/model_router.py'
      - 'computer/control_plane/local_agent.py'
      - 'computer/control_plane/model_gateway.py'
      - 'computer/control_plane/generalist_agent_bridge.py'
      - 'computer/code_agent.py'
      - 'computer/start.sh'
      - 'tests/test_model_gateway.py'
      - 'tests/test_local_agent.py'
      - 'tests/test_openrouter_provider.py'
      - '.github/workflows/generalist-lm.yml'
      - '.github/workflows/generalist-continuum.yml'
      - '.github/workflows/generalist-bootstrap.yml'
      - '.github/workflows/generalist-mobile-export.yml'
      - '.github/workflows/generalist-watchdog.yml'
  pull_request:
    branches: [main]
    paths:
      - 'computer/generalist_lm/**'
      - 'tests/test_generalist_lm.py'
      - 'tests/test_generalist_scalable_learning.py'
      - 'tests/test_generalist_grounded_learning.py'
      - 'tests/test_generalist_bpe.py'
      - 'tests/test_generalist_bpe_evolution.py'
      - 'tests/test_generalist_retention.py'
      - 'tests/test_generalist_provider.py'
      - 'tests/test_generalist_foundation.py'
      - 'tests/test_generalist_phase5.py'
      - 'tests/test_generalist_architecture.py'
      - 'tests/test_generalist_single_lineage.py'
      - 'tests/test_generalist_efficiency_engine.py'
      - 'tests/test_generalist_learning_efficiency.py'
      - '.github/workflows/generalist-architecture-search.yml'
      - '.github/workflows/generalist-incumbent-recovery.yml'
      - '.github/workflows/generalist-state-writer-janitor.yml'
      - '.github/workflows/generalist-bootstrap.yml'
      - 'tests/test_native_foundation.py'
      - 'tests/test_native_training.py'
      - 'tests/test_native_acquisition.py'
      - 'tests/test_native_evolution.py'
      - '.github/workflows/native-evolution.yml'
      - 'computer/control_plane/generalist_provider.py'
      - 'computer/control_plane/model_router.py'
      - 'computer/control_plane/local_agent.py'
      - 'computer/control_plane/model_gateway.py'
      - 'computer/control_plane/generalist_agent_bridge.py'
      - 'computer/code_agent.py'
      - 'computer/start.sh'
      - 'tests/test_model_gateway.py'
      - 'tests/test_local_agent.py'
      - 'tests/test_openrouter_provider.py'
      - '.github/workflows/generalist-lm.yml'
      - '.github/workflows/generalist-continuum.yml'
      - '.github/workflows/generalist-bootstrap.yml'
      - '.github/workflows/generalist-mobile-export.yml'
      - '.github/workflows/generalist-watchdog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generalist-lm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build isolated generalist LM environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check pytest
          .venv/bin/pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install --disable-pip-version-check 'transformers>=4.57,<5' 'accelerate>=1,<2' 'openai-harmony==0.0.8'
          .venv/bin/pip install --disable-pip-version-check -r computer/mathesis/requirements.txt

      - name: Validate Generalist workflow syntax
        run: |
          export GOBIN="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$GOBIN"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$GOBIN/actionlint" \
            .github/workflows/generalist-lm.yml \
            .github/workflows/generalist-continuum.yml \
            .github/workflows/generalist-bootstrap.yml \
            .github/workflows/generalist-architecture-search.yml \
            .github/workflows/generalist-incumbent-recovery.yml \
            .github/workflows/generalist-state-writer-janitor.yml \
            .github/workflows/generalist-mobile-export.yml \
            .github/workflows/generalist-watchdog.yml \
            .github/workflows/native-evolution.yml \
            .github/workflows/airi-runtime.yml

      - name: Validate Free-Speed continuity contract
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/generalist-continuum.yml").read_text(
              encoding="utf-8"
          )
          push_only_cancel = (
              "cancel-in-progress: $" + "{{ github.event_name == 'push' }}"
          )
          required = [
              "actions: write",
              "Hand off to the next autonomous Free-Speed cycle",
              "actions/workflows/generalist-continuum.yml/dispatches",
              "Another Generalist continuum run is already queued/running",
              push_only_cancel,
          ]
          missing = [item for item in required if item not in text]
          assert not missing, f"Free-Speed continuity contract missing: {missing}"
          assert "cancel-in-progress: true" not in text, (
              "Free-Speed continuity must not cancel scheduled/manual/workflow_run cycles"
          )
          PY

      - name: Compile generalist LM
        run: |
          .venv/bin/python -m compileall -q computer/generalist_lm computer/control_plane/generalist_provider.py computer/control_plane/model_router.py computer/control_plane/local_agent.py computer/control_plane/model_gateway.py computer/control_plane/generalist_agent_bridge.py computer/code_agent.py tests/test_generalist_phase5.py tests/test_generalist_architecture.py tests/test_generalist_single_lineage.py tests/test_generalist_efficiency_engine.py tests/test_generalist_learning_efficiency.py tests/test_generalist_lm.py tests/test_generalist_scalable_learning.py tests/test_generalist_grounded_learning.py tests/test_generalist_bpe.py tests/test_generalist_bpe_evolution.py tests/test_generalist_retention.py tests/test_generalist_provider.py tests/test_generalist_foundation.py tests/test_native_foundation.py tests/test_native_training.py tests/test_native_acquisition.py tests/test_native_evolution.py tests/test_model_gateway.py tests/test_local_agent.py tests/test_openrouter_provider.py

      - name: Run generalist LM regressions and learning smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/computer
        run: |
          .venv/bin/python -m pytest -q tests/test_generalist_phase5.py tests/test_generalist_architecture.py tests/test_generalist_single_lineage.py tests/test_generalist_efficiency_engine.py tests/test_generalist_learning_efficiency.py tests/test_generalist_lm.py tests/test_generalist_scalable_learning.py tests/test_generalist_grounded_learning.py tests/test_generalist_bpe.py tests/test_generalist_bpe_evolution.py tests/test_generalist_retention.py tests/test_generalist_provider.py tests/test_generalist_foundation.py tests/test_native_foundation.py tests/test_native_training.py tests/test_native_acquisition.py tests/test_native_evolution.py tests/test_model_gateway.py tests/test_local_agent.py tests/test_openrouter_provider.py

      - name: Offline wide-batch AIRI stability experiment
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/generalist-learning-efficiency-v3'
        env:
          PYTHONPATH: ${{ github.workspace }}/computer
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE_REPO="$RUNNER_TEMP/airi-generalist-state"
          RESULTS="$RUNNER_TEMP/airi-wide-batch-results"
          rm -rf "$STATE_REPO" "$RESULTS"
          git clone --quiet --depth 1 --branch generalist-state --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$STATE_REPO"
          STATE_DIR="$STATE_REPO/generalist-state"
          mkdir -p "$RESULTS"

          .venv/bin/python -m generalist_lm.learning_efficiency_benchmark \
            --state-dir "$STATE_DIR" \
            --output "$RESULTS/wide64.jsonl" \
            --segments 8128 \
            --seeds 5000000 \
            --threads 4 \
            --trials wide64,wide64_embeddings,wide64_causal20_ar

          .venv/bin/python -m generalist_lm.learning_efficiency_benchmark \
            --state-dir "$STATE_DIR" \
            --output "$RESULTS/wide128.jsonl" \
            --segments 16256 \
            --seeds 5000000 \
            --threads 4 \
            --trials wide128,wide128_embeddings,wide128_causal20_ar

          STATE_DIR="$STATE_DIR" RESULTS="$RESULTS" .venv/bin/python - <<'PY'
          import json
          import os
          from dataclasses import replace
          from pathlib import Path

          from generalist_lm.learning_efficiency_benchmark import (
              Trial,
              run_sequence,
              summarize_trials,
              trial_matrix,
          )

          root = Path(os.environ["STATE_DIR"])
          results = Path(os.environ["RESULTS"])

          rows = []
          for name in ("wide64.jsonl", "wide128.jsonl"):
              rows.extend(
                  json.loads(line)
                  for line in (results / name).read_text(encoding="utf-8").splitlines()
                  if line.strip()
              )
          summary = summarize_trials(rows)
          (results / "screen-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("WIDE_BATCH_SCREEN_SUMMARY")
          print(json.dumps(summary, indent=2, sort_keys=True))

          accepted = [row for row in rows if row["accepted"]]
          by_family = {"wide64": [], "wide128": []}
          for row in accepted:
              family = "wide128" if row["trial"]["effective_batch_size"] == 128 else "wide64"
              by_family[family].append(row)

          for family, candidates in by_family.items():
              if not candidates:
                  print(f"{family}: no accepted screen candidate; sustained sequence skipped")
                  continue
              best = max(
                  candidates,
                  key=lambda row: (
                      row["headroom_after"],
                      row["language_quality_after"],
                      -row["training_evaluation_seconds"],
                  ),
              )
              trial = Trial(**best["trial"])
              sizes = (
                  [16256, 16256, 16256]
                  if family == "wide128"
                  else [8128, 8128, 16256, 16256]
              )
              sequence = run_sequence(
                  root,
                  trial,
                  sizes,
                  seed=5000000,
              )
              path = results / f"{family}-best-sequence.json"
              path.write_text(
                  json.dumps(sequence, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              compact = [
                  {
                      "size": segment["trial"]["segment_tokens"],
                      "accepted": segment["accepted"],
                      "repetition": segment["after"]["repetition_rate"],
                      "headroom": segment["headroom_after"],
                      "accepted_h": segment["accepted_equivalent_tokens_per_hour"],
                  }
                  for segment in sequence["segments"]
              ]
              print(f"{family.upper()}_SUSTAINED_SEQUENCE")
              print(json.dumps(compact, indent=2, sort_keys=True))
          PY

      - name: Upload wide-batch experiment evidence
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feature/generalist-learning-efficiency-v3'
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-wide-batch-learning-efficiency-${{ github.run_id }}
          path: ${{ runner.temp }}/airi-wide-batch-results
          if-no-files-found: warn
          retention-days: 14

      - name: Qualified local gateway end-to-end smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/computer
          AIRI_GENERALIST_STATE: ${{ runner.temp }}/generalist-gateway
          AIRI_GENERALIST_ENABLE: '1'
          AIRI_MODEL_GATEWAY_TOKEN: 'ci-generalist-token'
          AIRI_MODEL_GATEWAY_PORT: '17894'
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          from generalist_lm.model import GeneralistLMConfig
          from generalist_lm.runtime import GeneralistRuntime
          from generalist_lm.qualification import checkpoint_digest, QUALIFICATION_VERSION

          root=Path(os.environ["AIRI_GENERALIST_STATE"])
          cfg=GeneralistLMConfig(vocab_size=264,context_length=64,d_model=32,n_heads=4,n_layers=1,d_ff=64,dropout=0.0).validate()
          GeneralistRuntime.fresh(cfg).save_checkpoint(root,metadata={"ci":True})
          digest=checkpoint_digest(root)
          (root/"benchmark.json").write_text(json.dumps({
              "qualification_version":QUALIFICATION_VERSION,
              "attested_by":"airi-generalist-qualification-v2",
              "checkpoint_digest":digest,
              "qualified":True,
              "minimum_score":85.0,
              "report":{"ok":True,"score":100.0,"critical_failures":[]},
          }),encoding="utf-8")
          PY

          .venv/bin/python -m control_plane.model_gateway >"$RUNNER_TEMP/generalist-gateway.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:17894/health" >/dev/null && break
            sleep 0.2
          done
          curl -fsS "http://127.0.0.1:17894/health" | jq -e '.configured == true and .qualified == true'
          curl -fsS -X POST "http://127.0.0.1:17894/v1/chat/completions" \
            -H 'Authorization: Bearer ci-generalist-token' \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"hello"}],"max_tokens":4}' \
            | jq -e '.object == "chat.completion" and (.choices[0].message.content | type == "string")'
          kill "$PID"
          wait "$PID" 2>/dev/null || true
          trap - EXIT

      - name: Standalone causal generation smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/computer
        run: |
          .venv/bin/python - <<'PY'
          import torch
          from generalist_lm.model import CausalTransformerLM, GeneralistLMConfig, parameter_count
          from generalist_lm.tokenizer import ByteTokenizer

          cfg=GeneralistLMConfig(
              vocab_size=264, context_length=64, d_model=32,
              n_heads=4, n_layers=1, d_ff=64, dropout=0.0,
          ).validate()
          model=CausalTransformerLM(cfg)
          tok=ByteTokenizer()
          prompt=torch.tensor([tok.encode("Hello", bos=True)],dtype=torch.long)
          out=model.generate(prompt,max_new_tokens=4,eos_token_id=None)
          assert out.shape[1] == prompt.shape[1] + 4
          assert parameter_count(model) > 0
          print({"ok":True,"parameters":parameter_count(model),"generated_tokens":4})
          PY
