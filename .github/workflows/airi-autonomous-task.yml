name: Airi-PC autonomous task

on:
  push:
    branches: [main]
    paths:
      - '.ai/remote_task.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airi-pc-autonomous-task
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AIRI_ROOT: ${{ github.workspace }}
      AIRIPC_WORKSPACE_ROOT: ${{ github.workspace }}
      AIRI_LIVE_TELEMETRY: '1'
      AIRI_LIVE_ALLOW_CI: '1'
      # Keep publishing to the channel the already-installed Android app is
      # currently listening to during this first remote task.
      AIRI_BOOTSTRAP_SHA: c8bcc0fc84d1721276a2dfe898a833dfa70cae43
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/computer
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Airi-PC verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Configure Git identity for Airi-PC
        run: |
          git config user.name "Airi-PC"
          git config user.email "airi-pc@users.noreply.github.com"

      - name: Execute task through Airi-PC ControlPlane
        run: python -m computer.control_plane.remote_task_runner .ai/remote_task.json

      - name: Upload Airi OS ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Airi-OS-amd64
          path: airi-os/out/*.iso
          if-no-files-found: warn
          retention-days: 30
