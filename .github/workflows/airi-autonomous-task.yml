name: Airi-PC autonomous task

on:
  push:
    branches: [main]
    paths:
      - '.ai/remote_task.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airi-pc-autonomous-task
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AIRI_ROOT: ${{ github.workspace }}
      AIRIPC_WORKSPACE_ROOT: ${{ github.workspace }}
      AIRI_LIVE_TELEMETRY: '1'
      AIRI_LIVE_ALLOW_CI: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/computer
      DISPLAY: ':99'
      AIRI_BROWSER_HEADLESS: '0'
      AIRI_SCREEN_SHARE: '1'
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Airi-PC verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Start Airi-PC graphical display
        run: |
          if pgrep -x Xvfb >/dev/null 2>&1; then pkill Xvfb || true; sleep 1; fi
          Xvfb :99 -screen 0 1280x800x24 -ac >/tmp/airi-xvfb.log 2>&1 &
          sleep 1
          pgrep -x Xvfb

      - name: Configure Git identity for Airi-PC
        run: |
          git config user.name "Airi-PC"
          git config user.email "airi-pc@users.noreply.github.com"

      - name: Execute task through Airi-PC ControlPlane
        run: python -m computer.control_plane.remote_task_runner .ai/remote_task.json

      - name: Upload Airi OS ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Airi-OS-amd64
          path: airi-os/out/*.iso
          if-no-files-found: warn
          retention-days: 30
