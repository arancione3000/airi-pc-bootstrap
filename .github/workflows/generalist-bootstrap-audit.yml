name: AIRI Generalist Phase 5 Checkpoint Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'computer/generalist_lm/bootstrap_training.py'
      - 'computer/generalist_lm/bootstrap_audit.py'
      - '.github/workflows/generalist-bootstrap.yml'
      - '.github/workflows/generalist-bootstrap-audit.yml'

permissions:
  contents: read

concurrency:
  group: airi-generalist-phase5-audit-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: computer
      STATE_REPO: /tmp/airi-phase5-audit-state
      STATE_DIR: /tmp/airi-phase5-audit-state/generalist-state
      HISTORICAL_LANGUAGE_RECOVERY_REF: 'a33056c2beef538ec68a7d3c88bd65c2fc69b079'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: computer/mathesis/requirements.txt

      - name: Install CPU audit runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu

      - name: Restore immutable Phase 5 checkpoint state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "${STATE_REPO}"
          git clone --quiet --depth 1 --branch generalist-state --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${STATE_REPO}"
          test -f "${STATE_DIR}/bootstrap-data/candidate/model.pt"
          if [[ -f "${STATE_DIR}/bootstrap-data/best/model.pt" ]]; then
            echo "Historical causal-best checkpoint available for direct comparison."
          else
            echo "No causal-best checkpoint after structural growth; auditing active AIRI independently."
          fi

      - name: Verify historical healthy seed and trainable 50M regrowth
        run: |
          set -euo pipefail
          git -C "${STATE_REPO}" fetch --quiet --depth 1 origin "${HISTORICAL_LANGUAGE_RECOVERY_REF}"
          recovery_root="/tmp/airi-historical-language-audit"
          rm -rf "${recovery_root}"
          mkdir -p "${recovery_root}"
          git -C "${STATE_REPO}" archive "${HISTORICAL_LANGUAGE_RECOVERY_REF}" generalist-state/bootstrap-data/best             | tar -xf - -C "${recovery_root}"
          export RECOVERY_SOURCE="${recovery_root}/generalist-state/bootstrap-data/best"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import torch

          from generalist_lm.bootstrap_training import (
              _grow_bootstrap_runtime,
              _historical_language_source_genome,
          )
          from generalist_lm.model import parameter_count
          from generalist_lm.phase5_diagnostics import evaluate_phase5_language
          from generalist_lm.runtime import GeneralistRuntime

          state = Path(os.environ["STATE_DIR"])
          source_dir = Path(os.environ["RECOVERY_SOURCE"])
          progress = json.loads((state / "bootstrap-data" / "progress.json").read_text())
          metadata = json.loads((source_dir / "metadata.json").read_text())

          assert metadata["parameters"] == 7_021_248
          assert metadata["tokens_processed"] == 31_210_573
          source = GeneralistRuntime.from_checkpoint(source_dir, device="cpu")
          source_report = evaluate_phase5_language(source)
          assert source_report["pathological_repetition"] is False
          assert source_report["multiword_output_rate"] >= 0.35

          genome = _historical_language_source_genome(
              progress,
              source_parameters=parameter_count(source.model),
          )
          grown_genome, grown, growth = _grow_bootstrap_runtime(
              genome,
              source,
              target_parameters=50_000_000,
          )
          assert growth["weight_transfer"]["function_preserving_growth"] is True
          assert 49_000_000 <= parameter_count(grown.model) <= 51_000_000

          ids = torch.tensor([[1, 40, 41, 42, 43, 44, 45, 46]], dtype=torch.long)
          source.model.eval()
          grown.model.eval()
          with torch.no_grad():
              before = source.model(ids)["logits"]
              after = grown.model(ids)["logits"]
          delta = float((before - after).abs().max().item())
          assert delta <= 1.0e-5

          old_ff = source.config.d_ff
          new_ff = grown.config.d_ff
          assert new_ff > old_ff
          up = grown.model.blocks[0].ff.up.weight
          down = grown.model.blocks[0].ff.down.weight
          assert torch.count_nonzero(up[old_ff:new_ff]).item() > 0
          assert torch.count_nonzero(up[new_ff + old_ff: 2 * new_ff]).item() > 0
          assert torch.count_nonzero(down[:, old_ff:]).item() == 0

          print(json.dumps({
              "source_parameters": parameter_count(source.model),
              "grown_parameters": parameter_count(grown.model),
              "source_language_nll": source_report["language_nll"],
              "source_pathological_repetition": source_report["pathological_repetition"],
              "source_multiword_output_rate": source_report["multiword_output_rate"],
              "max_logit_delta": delta,
              "grown_d_ff": grown_genome.d_ff,
          }, indent=2, sort_keys=True))
          PY

      - name: Audit active Phase 5 generation and compare compatible best when available
        run: |
          set -euo pipefail
          python -m generalist_lm.bootstrap_audit \
            --state-dir "${STATE_DIR}" \
            --output /tmp/phase5-checkpoint-audit.json \
            | tee /tmp/phase5-checkpoint-audit.stdout.json
          jq -e '
            .training_data_used == false
            and .held_out_suite_used_for_diagnosis_only == true
            and .active_candidate_audited == true
            and .valid_tokens.invariant_holds == true
            and (
              .language_rehabilitation.available == false
              or (
                .language_rehabilitation.rollback_verified == true
                and .language_rehabilitation.lineage_preserved == true
              )
            )
          ' \
            /tmp/phase5-checkpoint-audit.json

      - name: Upload checkpoint audit
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-Phase5-Checkpoint-Audit-${{ github.run_number }}
          path: /tmp/phase5-checkpoint-audit.json
          if-no-files-found: error
          retention-days: 14
