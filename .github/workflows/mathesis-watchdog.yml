name: MATHESIS Omega Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '1,11,21,31,41,51 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mathesis-watchdog.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: mathesis-omega-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check MATHESIS state heartbeat
        id: heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_SECONDS: '900'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/mathesis-state"

          if ! payload="$(curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing_or_unreadable_state_branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sync="$(jq -r '.commit.commit.committer.date // .commit.commit.author.date // empty' <<<"$payload")"
          if [[ -z "$last_sync" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing_timestamp" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          sync_epoch="$(date -u -d "$last_sync" +%s)"
          age="$((now_epoch - sync_epoch))"
          if (( age < 0 )); then age=0; fi
          echo "age_seconds=$age" >> "$GITHUB_OUTPUT"

          active=0
          for status in pending queued in_progress; do
            runs="$(curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mathesis-continuum.yml/runs?status=${status}&per_page=1")"
            active="$((active + $(jq -r '.total_count // 0' <<<"$runs")))"
          done
          if (( active > 0 )); then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

          if (( age > MAX_AGE_SECONDS )); then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "reason=heartbeat_older_than_15_minutes" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "reason=heartbeat_fresh" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch recovery cycle
        if: steps.heartbeat.outputs.stale == 'true' && steps.heartbeat.outputs.active != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mathesis-continuum.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Heartbeat healthy or recovery already active
        if: steps.heartbeat.outputs.stale != 'true' || steps.heartbeat.outputs.active == 'true'
        run: |
          echo "MATHESIS heartbeat is healthy or an evolution cycle is already queued/running; no duplicate recovery."
