name: Airi Live Android

on:
  push:
    branches: [main]
    paths:
      - 'airi-live-android/**'
      - 'computer/control_plane/live_telemetry.py'
      - 'computer/control_plane/task_engine.py'
      - 'computer/control_plane/job_manager.py'
      - 'tests/test_live_telemetry.py'
      - '.github/workflows/airi-live-android.yml'
  pull_request:
    paths:
      - 'airi-live-android/**'
      - 'computer/control_plane/live_telemetry.py'
      - 'computer/control_plane/task_engine.py'
      - 'computer/control_plane/job_manager.py'
      - 'tests/test_live_telemetry.py'
      - '.github/workflows/airi-live-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airi-live-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check Maven Central connectivity
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            --max-time 30 \
            https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.pom \
            --output /dev/null
      - name: Build installable APK
        working-directory: airi-live-android
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt/3"
            EXTRA=""
            if [ "$attempt" -gt 1 ]; then EXTRA="--refresh-dependencies"; fi
            gradle :app:assembleDebug --stacktrace --no-daemon $EXTRA
            rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit "$rc"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Airi-Live-Android
          path: airi-live-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: End-to-end Airi Live relay smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/computer
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          from control_plane.live_telemetry import topic_for

          title = "Airi Live 1.1 ready"
          payload = {
              "v": 1,
              "id": "airi-live-v1-1-smoke",
              "ts": int(time.time()),
              "kind": "runtime",
              "title": title,
              "detail": "stable relay verified",
              "status": "completed",
              "task_id": "",
              "node_id": "",
              "source_sha": "smoke-test",
          }
          topic = topic_for()
          body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
          req = urllib.request.Request(
              f"https://ntfy.sh/{topic}",
              data=body,
              method="POST",
              headers={"Content-Type": "text/plain; charset=utf-8", "User-Agent": "Airi-Live-CI/1.1"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              print("publish_status=", response.status)
              assert 200 <= response.status < 300

          found = False
          for attempt in range(8):
              time.sleep(1.5)
              url = f"https://ntfy.sh/{topic}/json?poll=1&since=10m"
              with urllib.request.urlopen(url, timeout=20) as response:
                  lines = response.read().decode("utf-8").splitlines()
              for line in lines:
                  try:
                      outer = json.loads(line)
                      event = json.loads(outer.get("message", "{}"))
                  except Exception:
                      continue
                  if event.get("id") == payload["id"] and event.get("title") == title:
                      found = True
                      break
              if found:
                  break
              print(f"relay poll attempt {attempt + 1}: event not visible yet")
          assert found, "published telemetry was not readable from relay after retries"
          print("AIRI_LIVE_RELAY_SMOKE=PASS")
          PY
      - name: Publish installable Airi Live 1.1 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="airi-live-v1.1.0"
          APK="airi-live-android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="Airi-Live-v1.1.0.apk"
          cp "$APK" "$OUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" --clobber
          else
            gh release create "$TAG" "$OUT" \
              --target "$GITHUB_SHA" \
              --title "Airi Live v1.1.0" \
              --notes "Stable live channel, end-to-end relay verification, and improved connection status."
          fi
