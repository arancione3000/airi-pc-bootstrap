name: Airi Live Android

on:
  push:
    branches: [main]
    paths:
      - 'airi-live-android/**'
      - 'computer/control_plane/live_telemetry.py'
      - 'computer/control_plane/task_engine.py'
      - 'computer/control_plane/job_manager.py'
      - 'tests/test_live_telemetry.py'
      - '.github/workflows/airi-live-android.yml'
  pull_request:
    paths:
      - 'airi-live-android/**'
      - 'computer/control_plane/live_telemetry.py'
      - 'computer/control_plane/task_engine.py'
      - 'computer/control_plane/job_manager.py'
      - 'tests/test_live_telemetry.py'
      - '.github/workflows/airi-live-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check Maven Central connectivity
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            --max-time 30 \
            https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.pom \
            --output /dev/null
      - name: Build installable APK
        working-directory: airi-live-android
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt/3"
            EXTRA=""
            if [ "$attempt" -gt 1 ]; then EXTRA="--refresh-dependencies"; fi
            gradle :app:assembleDebug --stacktrace --no-daemon $EXTRA
            rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit "$rc"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Airi-Live-Android
          path: airi-live-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
