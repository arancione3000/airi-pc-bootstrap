name: Airi Live Android

on:
  push:
    branches: [main]
    paths:
      - 'airi-live-android/**'
      - '.ai/airi_live.json'
      - 'computer/control_plane/live_telemetry.py'
      - 'computer/control_plane/task_engine.py'
      - 'computer/control_plane/job_manager.py'
      - 'computer/control_plane/screen_share.py'
      - 'computer/control_plane/remote_task_runner.py'
      - 'scripts/airi_live_emulator_backend.py'
      - 'scripts/airi_live_android_emulator_test.sh'
      - 'tests/test_live_telemetry.py'
      - '.github/workflows/airi-live-android.yml'
  pull_request:
    paths:
      - 'airi-live-android/**'
      - '.ai/airi_live.json'
      - 'computer/control_plane/live_telemetry.py'
      - 'computer/control_plane/task_engine.py'
      - 'computer/control_plane/job_manager.py'
      - 'computer/control_plane/screen_share.py'
      - 'computer/control_plane/remote_task_runner.py'
      - 'scripts/airi_live_emulator_backend.py'
      - 'tests/test_live_telemetry.py'
      - 'scripts/airi_live_android_emulator_test.sh'
      - '.github/workflows/airi-live-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airi-live-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check Maven Central connectivity
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            --max-time 30 \
            https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.pom \
            --output /dev/null
      - name: Build installable APK
        working-directory: airi-live-android
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt/3"
            EXTRA=""
            if [ "$attempt" -gt 1 ]; then EXTRA="--refresh-dependencies"; fi
            gradle :app:assembleDebug --stacktrace --no-daemon $EXTRA
            rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit "$rc"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Airi-Live-Android
          path: airi-live-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: End-to-end Airi Live relay smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/computer
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          from control_plane.live_telemetry import topic_for

          title = "Airi Live 1.4 ready"
          payload = {
              "v": 1,
              "id": "airi-live-v1-4-smoke",
              "ts": int(time.time()),
              "kind": "runtime",
              "title": title,
              "detail": "stable relay verified",
              "status": "completed",
              "task_id": "",
              "node_id": "",
              "source_sha": "smoke-test",
              "session_id": "ci-smoke-v1.4",
              "protocol": 2,
          }
          topic = topic_for()
          body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
          req = urllib.request.Request(
              f"https://ntfy.sh/{topic}",
              data=body,
              method="POST",
              headers={"Content-Type": "text/plain; charset=utf-8", "User-Agent": "Airi-Live-CI/1.4"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              print("publish_status=", response.status)
              assert 200 <= response.status < 300

          found = False
          for attempt in range(8):
              time.sleep(1.5)
              url = f"https://ntfy.sh/{topic}/json?poll=1&since=10m"
              with urllib.request.urlopen(url, timeout=20) as response:
                  lines = response.read().decode("utf-8").splitlines()
              for line in lines:
                  try:
                      outer = json.loads(line)
                      event = json.loads(outer.get("message", "{}"))
                  except Exception:
                      continue
                  if event.get("id") == payload["id"] and event.get("title") == title:
                      found = True
                      break
              if found:
                  break
              print(f"relay poll attempt {attempt + 1}: event not visible yet")
          assert found, "published telemetry was not readable from relay after retries"
          print("AIRI_LIVE_RELAY_SMOKE=PASS")
          PY

  emulator-pov-e2e:
    name: Android emulator POV end-to-end
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PYTHONPATH: ${{ github.workspace }}/computer
      AIRI_ROOT: ${{ github.workspace }}
      AIRIPC_WORKSPACE_ROOT: ${{ github.workspace }}
      AIRI_LIVE_TELEMETRY: '1'
      AIRI_LIVE_ALLOW_CI: '1'
      AIRI_SCREEN_SHARE: '1'
      AIRI_LIVE_SESSION_ID: android-emu-${{ github.run_id }}-${{ github.run_attempt }}
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Airi-Live-Android
          path: emulator-apk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Airi-PC POV dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xterm x11-xserver-utils

      - name: Start graphical Airi-PC POV backend
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x800x24 -ac >/tmp/airi-emu-xvfb.log 2>&1 &
          echo $! >/tmp/airi-emu-xvfb.pid
          sleep 1
          DISPLAY=:99 xsetroot -solid '#00ffff'
          DISPLAY=:99 xterm -geometry 104x32+70+55 -bg '#00ffff' -fg '#101014' -title 'Airi-PC POV E2E' \
            -e bash -lc 'while true; do printf "\033c\n  AIRI-PC POV E2E\n\n  LIVE DESKTOP -> ANDROID\n\n  %s\n" "$(date -u +%H:%M:%S.%3N)"; sleep 0.10; done' \
            >/tmp/airi-emu-xterm.log 2>&1 &
          echo $! >/tmp/airi-emu-xterm.pid
          python scripts/airi_live_emulator_backend.py >/tmp/airi-emu-backend.log 2>&1 &
          echo $! >/tmp/airi-emu-backend.pid
          for i in $(seq 1 90); do
            if grep -q 'AIRI_ANDROID_EMULATOR_BACKEND=READY' /tmp/airi-emu-backend.log; then
              cat /tmp/airi-emu-backend.log
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/airi-emu-backend.pid)" 2>/dev/null; then
              cat /tmp/airi-emu-backend.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/airi-emu-backend.log
          exit 1

      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run APK in Android emulator and verify POV pixels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/scripts/airi_live_android_emulator_test.sh"

      - name: Upload Android emulator POV screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Airi-Live-Android-POV-Screenshots
          path: ${{ runner.temp }}/airi-live-pov/
          if-no-files-found: warn

      - name: Stop Airi-PC POV backend
        if: always()
        run: |
          test ! -f /tmp/airi-emu-backend.log || cat /tmp/airi-emu-backend.log
          test ! -f /tmp/airi-emu-backend.pid || kill "$(cat /tmp/airi-emu-backend.pid)" 2>/dev/null || true
          test ! -f /tmp/airi-emu-xterm.pid || kill "$(cat /tmp/airi-emu-xterm.pid)" 2>/dev/null || true
          test ! -f /tmp/airi-emu-xvfb.pid || kill "$(cat /tmp/airi-emu-xvfb.pid)" 2>/dev/null || true


  publish-tested-release:
    name: Publish emulator-verified APK
    needs: [build, emulator-pov-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Airi-Live-Android
          path: release-apk

      - name: Publish installable Airi Live 1.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="airi-live-v1.4.0"
          APK="$(find release-apk -name '*.apk' -type f | head -n1)"
          test -n "$APK"
          OUT="Airi-Live-v1.4.0.apk"
          cp "$APK" "$OUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$OUT" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Airi Live v1.4.0" \
              --notes "Emulator-verified encrypted Airi-PC POV, continuous MJPEG streaming around 8-10 FPS, session-aware timeline, and zero-config rebuild discovery."
          fi
