name: AIRI Generalist Language Bootstrap

on:
  workflow_dispatch:
    inputs:
      target_tokens:
        description: Cumulative causal tokens for this bootstrap rung
        required: false
        default: '1000000'
  push:
    branches: [main]
    paths:
      - 'computer/generalist_lm/bootstrap_data.py'
      - 'computer/generalist_lm/bootstrap_training.py'
      - 'computer/generalist_lm/phase5_diagnostics.py'
      - 'computer/generalist_lm/model.py'
      - 'computer/generalist_lm/runtime.py'
      - 'computer/generalist_lm/research_cycle.py'
      - 'computer/generalist_lm/generalist_swarm.py'
      - 'computer/generalist_lm/lineage_migration.py'
      - '.github/workflows/generalist-bootstrap.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: airi-generalist-language-bootstrap
  cancel-in-progress: ${{ github.event_name == 'push' }}
# The state-writer janitor also cancels older bootstrap commits on code pushes.

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONPATH: computer
      STATE_REPO: /tmp/airi-generalist-phase5-state-repo
      STATE_DIR: /tmp/airi-generalist-phase5-state-repo/generalist-state
      CACHE_DIR: /tmp/airi-generalist-phase5-cache
      TARGET_TOKENS: ${{ github.event.inputs.target_tokens || '1000000' }}
      ARCHITECTURE_INTERVAL_TOKENS: '5000000'
      ARCHITECTURE_HANDOFF: 'false'
      HISTORICAL_LANGUAGE_RECOVERY_REF: 'a33056c2beef538ec68a7d3c88bd65c2fc69b079'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: computer/mathesis/requirements.txt

      - name: Install CPU bootstrap runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'datasets>=3.6,<5'

      - name: Wait for active higher-priority state writers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The language bootstrap is now the authoritative live-app writer.
          # Continuum already has a bootstrap gate and must yield to an active
          # bootstrap; waiting for queued Continuum runs here would invert that
          # priority and can create an unnecessary mutual wait.
          for _ in $(seq 1 90); do
            payload="$(curl --fail-with-body -sS --retry 3 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generalist-incumbent-recovery.yml/runs?per_page=30")"
            active="$(jq '
              [
                .workflow_runs[]
                | select(
                    .status == "pending"
                    or .status == "queued"
                    or .status == "in_progress"
                    or .status == "waiting"
                    or .status == "requested"
                  )
              ] | length
            ' <<<"${payload}")"
            if (( active == 0 )); then
              echo "Bootstrap now owns the Generalist state-write window."
              exit 0
            fi
            echo "Waiting for ${active} active incumbent-recovery writer(s)."
            sleep 20
          done
          echo "Timed out waiting for incumbent recovery writer." >&2
          exit 1

      - name: Restore latest persistent Generalist state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "${STATE_REPO}" "${CACHE_DIR}"
          git clone --quiet --depth 1 --branch generalist-state --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${STATE_REPO}"
          git -C "${STATE_REPO}" config user.name "AIRI Generalist Phase 5"
          git -C "${STATE_REPO}" config user.email "airi-generalist@users.noreply.github.com"
          mkdir -p "${CACHE_DIR}"
          test -f "${STATE_DIR}/champion/model.pt"
          test -f "${STATE_DIR}/status.json"

          persisted_target=0
          if [[ -f "${STATE_DIR}/bootstrap-data/progress.json" ]]; then
            persisted_target="$(jq -r '.target_tokens // 0' "${STATE_DIR}/bootstrap-data/progress.json")"
          fi
          effective_target="${TARGET_TOKENS}"
          if (( persisted_target > effective_target )); then
            effective_target="${persisted_target}"
          fi
          echo "TARGET_TOKENS=${effective_target}" >> "${GITHUB_ENV}"

          progress="${STATE_DIR}/bootstrap-data/progress.json"
          report="${STATE_DIR}/bootstrap-data/report.json"
          persisted_complete=false
          if [[ -s "${progress}" && -s "${report}" ]]; then
            if jq -e --argjson target "${effective_target}" '
              (.tokens_processed // 0) >= $target
              and ([.completed_rungs[]?] | index($target) != null)
              and ([.sft_completed_rungs[]?] | index($target) != null)
            ' "${progress}" >/dev/null \
              && jq -e --argjson target "${effective_target}" '
                (.target_tokens // 0) == $target
              ' "${report}" >/dev/null; then
              persisted_complete=true
            fi
          fi
          echo "PERSISTED_RUNG_COMPLETE=${persisted_complete}" >> "${GITHUB_ENV}"

          if [[ "${persisted_complete}" != "true" ]]; then
            printf '{"workflow_run_id":%s,"target_tokens":%s,"requested_target_tokens":%s,"started_at":"%s"}\n' \
              "${GITHUB_RUN_ID}" "${effective_target}" "${TARGET_TOKENS}" "$(date -u +%FT%TZ)" \
              > "${STATE_DIR}/bootstrap-data-active.json"
          else
            rm -f "${STATE_DIR}/bootstrap-data-active.json"
            echo "Phase 5 target ${effective_target} is already fully persisted; skipping corpus rebuild/training."
          fi

      - name: Prepare verified historical language recovery source
        if: env.PERSISTED_RUNG_COMPLETE != 'true'
        run: |
          set -euo pipefail
          progress="${STATE_DIR}/bootstrap-data/progress.json"
          recovery_source=""
          if [[ -s "${progress}" ]] && jq -e '
            .lineage_id == "airi-5d3d25177d2e83f7"
            and ((.language_rehabilitation.consecutive_rejections // 0) >= 4)
            and ((.historical_language_recovery.completed // false) != true)
          ' "${progress}" >/dev/null; then
            echo "Repeated R1 rollback detected; restoring the verified historical healthy best."
            git -C "${STATE_REPO}" fetch --quiet --depth 1 origin "${HISTORICAL_LANGUAGE_RECOVERY_REF}"
            recovery_root="/tmp/airi-historical-language-recovery"
            rm -rf "${recovery_root}"
            mkdir -p "${recovery_root}"
            git -C "${STATE_REPO}" archive "${HISTORICAL_LANGUAGE_RECOVERY_REF}" \
              generalist-state/bootstrap-data/best \
              | tar -xf - -C "${recovery_root}"
            recovery_source="${recovery_root}/generalist-state/bootstrap-data/best"
            test -f "${recovery_source}/model.pt"
            test -f "${recovery_source}/config.json"
            test -f "${recovery_source}/metadata.json"
            jq -e '
              .parameters == 7021248
              and .tokens_processed == 31210573
            ' "${recovery_source}/metadata.json" >/dev/null
          fi
          echo "HISTORICAL_RECOVERY_SOURCE=${recovery_source}" >> "${GITHUB_ENV}"

      - name: Restore reusable bootstrap source cache
        if: env.PERSISTED_RUNG_COMPLETE != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: airi-generalist-phase5-data-v2-${{ runner.os }}-${{ env.TARGET_TOKENS }}
          restore-keys: |
            airi-generalist-phase5-data-v2-${{ runner.os }}-

      - name: Restore reusable packed-token cache
        if: env.PERSISTED_RUNG_COMPLETE != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_DIR }}/phase5-packed-blocks-v1
          key: airi-generalist-phase5-packed-v1-${{ runner.os }}-${{ env.TARGET_TOKENS }}-${{ github.run_id }}
          restore-keys: |
            airi-generalist-phase5-packed-v1-${{ runner.os }}-${{ env.TARGET_TOKENS }}-

      - name: Reuse already-completed persisted bootstrap rung
        if: env.PERSISTED_RUNG_COMPLETE == 'true'
        run: |
          set -euo pipefail
          test -s "${STATE_DIR}/bootstrap-data/report.json"
          test -s "${STATE_DIR}/bootstrap-data/manifest.json"
          jq -e '.external_pretrained_weights_used == false and .external_model_distillation_used == false' \
            "${STATE_DIR}/bootstrap-data/manifest.json"
          echo "RUNG_COMPLETE=true" >> "${GITHUB_ENV}"

      - name: Run resumable language-first bootstrap segments
        if: env.PERSISTED_RUNG_COMPLETE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: |
          set -euo pipefail
          persist_state() {
            local label="$1"
            cd "${STATE_REPO}"
            git add -A generalist-state
            git add -A generalist-state/bootstrap-data-active.json || true
            git commit --allow-empty -m "generalist-state: phase5 ${label}"

            # Architecture/Continuum may have completed a state-only commit
            # after this long training segment took its snapshot.  Preserve
            # those non-bootstrap updates and replay the Phase-5 checkpoint on
            # top instead of losing the trained segment to non-fast-forward.
            local pushed=false
            for attempt in $(seq 1 8); do
              git fetch --quiet origin generalist-state
              remote_sha="$(git rev-parse origin/generalist-state)"
              if ! git merge-base --is-ancestor "${remote_sha}" HEAD; then
                if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
                  echo "generalist-state advanced; expanding shallow history only for safe reconciliation."
                  git fetch --quiet --unshallow origin generalist-state
                  remote_sha="$(git rev-parse origin/generalist-state)"
                fi
                echo "generalist-state advanced during Phase-5 compute; rebasing checkpoint (attempt ${attempt})."
                if ! GIT_EDITOR=true git rebase origin/generalist-state; then
                  git rebase --abort || true
                  echo "Phase-5 state reconciliation conflicted; refusing an unsafe overwrite." >&2
                  exit 1
                fi
              fi
              if git push --quiet origin HEAD:generalist-state; then
                pushed=true
                break
              fi
              echo "generalist-state advanced during push; retrying reconciliation."
              sleep 2
            done
            if [[ "${pushed}" != "true" ]]; then
              echo "Could not transactionally persist Phase-5 checkpoint after retries." >&2
              exit 1
            fi
            cd "${GITHUB_WORKSPACE}"
          }

          rung_complete=false
          architecture_handoff=false
          progress_file="${STATE_DIR}/bootstrap-data/progress.json"
          handoff_file="${STATE_DIR}/architecture-research/live-lineage-handoff.json"
          initial_tokens="$(jq -r '.tokens_processed // 0' "${progress_file}" 2>/dev/null || echo 0)"
          last_architecture_tokens=""
          if [[ -s "${handoff_file}" ]]; then
            last_architecture_tokens="$(jq -r '.last_requested_tokens // empty' "${handoff_file}")"
          fi
          if [[ -z "${last_architecture_tokens}" ]]; then
            last_architecture_tokens="$(( (initial_tokens / ARCHITECTURE_INTERVAL_TOKENS) * ARCHITECTURE_INTERVAL_TOKENS ))"
          fi

          segment_tokens=250000
          if (( TARGET_TOKENS >= 100000000 )); then
            # The 7M model is compute-efficient; repeatedly rebuilding/loading
            # the reviewed 20M-token corpus dominates tiny 250k segments.
            # Amortize that fixed cost while still persisting transactionally
            # after every 1M-token unit of work.
            segment_tokens=1000000
          fi
          for segment in $(seq 1 4); do
            echo "Phase 5 segment ${segment}; target=${TARGET_TOKENS}; budget=${segment_tokens}"
            recovery_args=()
            if [[ -n "${HISTORICAL_RECOVERY_SOURCE:-}" ]]; then
              recovery_args+=(--historical-recovery-source "${HISTORICAL_RECOVERY_SOURCE}")
            fi
            python -m generalist_lm.bootstrap_training \
              --state-dir "${STATE_DIR}" \
              --repo-root "${GITHUB_WORKSPACE}" \
              --cache-dir "${CACHE_DIR}" \
              --target-tokens "${TARGET_TOKENS}" \
              --segment-tokens "${segment_tokens}" \
              --batch-size 32 \
              --learning-rate 0.0003 \
              "${recovery_args[@]}" \
              | tee /tmp/phase5-segment.json

            persist_state "target ${TARGET_TOKENS} segment ${segment}"

            curl --fail-with-body -sS --retry 3 --retry-all-errors -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generalist-mobile-export.yml/dispatches" \
              -d '{"ref":"main"}'
            echo "Queued mobile export for the freshly persisted AIRI Live checkpoint."

            rung_complete="$(jq -r '.rung_complete' /tmp/phase5-segment.json)"
            capacity_growth_only="$(jq -r '.capacity_growth_only // false' /tmp/phase5-segment.json)"
            historical_recovery_only="$(jq -r '.historical_recovery_only // false' /tmp/phase5-segment.json)"
            if [[ "${rung_complete}" == "true" ]]; then
              break
            fi
            if [[ "${capacity_growth_only}" == "true" ]]; then
              echo "AIRI 50M assisted growth persisted; resume training in a fresh run."
              break
            fi
            if [[ "${historical_recovery_only}" == "true" ]]; then
              echo "Healthy historical language checkpoint regrown to 50M and persisted; resume conservatively in a fresh run."
              break
            fi

            if (( TARGET_TOKENS >= 100000000 )); then
              current_tokens="$(jq -r '.tokens_processed // 0' "${progress_file}")"
              since_architecture="$(( current_tokens - last_architecture_tokens ))"
              if (( since_architecture >= ARCHITECTURE_INTERVAL_TOKENS )); then
                mkdir -p "$(dirname "${handoff_file}")"
                jq -n \
                  --argjson last_requested_tokens "${current_tokens}" \
                  --argjson target_tokens "${TARGET_TOKENS}" \
                  --arg reason "periodic-single-lineage-architecture-window" \
                  '{
                    schema: 1,
                    version: "airi-live-lineage-handoff-v1",
                    last_requested_tokens: $last_requested_tokens,
                    target_tokens: $target_tokens,
                    reason: $reason
                  }' > "${handoff_file}"
                persist_state "architecture handoff at ${current_tokens} tokens"
                architecture_handoff=true
                break
              fi
            fi
          done

          echo "RUNG_COMPLETE=${rung_complete}" >> "${GITHUB_ENV}"
          echo "ARCHITECTURE_HANDOFF=${architecture_handoff}" >> "${GITHUB_ENV}"
          if [[ "${rung_complete}" == "true" ]]; then
            test -s "${STATE_DIR}/bootstrap-data/report.json"
            jq -e '.external_pretrained_weights_used == false and .external_model_distillation_used == false' \
              "${STATE_DIR}/bootstrap-data/manifest.json"
            rm -f "${STATE_DIR}/bootstrap-data-active.json"
            persist_state "target ${TARGET_TOKENS} complete"
          else
            persist_state "target ${TARGET_TOKENS} checkpointed"
          fi

      - name: Upload Phase 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-Generalist-Phase5-Evidence-${{ github.run_number }}
          path: |
            ${{ env.STATE_DIR }}/bootstrap-data/manifest.json
            ${{ env.STATE_DIR }}/bootstrap-data/progress.json
            ${{ env.STATE_DIR }}/bootstrap-data/before.json
            ${{ env.STATE_DIR }}/bootstrap-data/after.json
            ${{ env.STATE_DIR }}/bootstrap-data/report.json
            ${{ env.STATE_DIR }}/bootstrap-data/language-rehabilitation.json
            ${{ env.STATE_DIR }}/bootstrap-data/language-recovery.json
            ${{ env.STATE_DIR }}/bootstrap-data/airi-pc-lab-after.json
          if-no-files-found: warn
          retention-days: 14

      - name: Hand the live AIRI lineage to a bounded architecture window
        if: env.RUNG_COMPLETE != 'true' && env.ARCHITECTURE_HANDOFF == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --retry 3 --retry-all-errors -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generalist-architecture-search.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"force_search\":\"true\",\"resume_bootstrap_target\":\"${TARGET_TOKENS}\"}}"
          echo "Architecture window dispatched for the same live lineage at target ${TARGET_TOKENS}."

      - name: Resume an incomplete rung from its persisted checkpoint
        if: env.RUNG_COMPLETE != 'true' && env.ARCHITECTURE_HANDOFF != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generalist-bootstrap.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"target_tokens\":\"${TARGET_TOKENS}\"}}"
          echo "NEXT_BOOTSTRAP_TARGET=${TARGET_TOKENS}" >> "${GITHUB_ENV}"

      - name: Dispatch next in-place language rung
        if: env.RUNG_COMPLETE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="${STATE_DIR}/bootstrap-data/report.json"
          current="$(jq -r '.target_tokens' "${report}")"
          next=""

          if [[ "${current}" -lt 5000000 ]]; then
            next=5000000
          elif [[ "${current}" -lt 20000000 ]]; then
            next=20000000
          elif [[ "${current}" -lt 100000000 ]]; then
            next=100000000
          elif [[ "${current}" -lt 250000000 ]]; then
            next=250000000
          elif [[ "${current}" -lt 500000000 ]]; then
            next=500000000
          elif [[ "${current}" -lt 1000000000 ]]; then
            next=1000000000
          fi

          # Remove only the retired swarm-handoff marker. Architecture research
          # now returns through the single-lineage migration protocol instead
          # of replacing AIRI with an independently trained checkpoint.
          marker="${STATE_DIR}/bootstrap-next-target.json"
          rm -f "${marker}"
          cd "${STATE_REPO}"
          rm -f generalist-state/bootstrap-next-target.json
          git add -A generalist-state/bootstrap-next-target.json || true
          git commit --allow-empty -m "generalist-state: direct in-place bootstrap handoff ${current} -> ${next:-complete}"
          git push --quiet origin HEAD:generalist-state
          cd "${GITHUB_WORKSPACE}"

          if [[ -n "${next}" ]]; then
            curl --fail-with-body -sS --retry 3 --retry-all-errors -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generalist-bootstrap.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"target_tokens\":\"${next}\"}}"
            echo "NEXT_BOOTSTRAP_TARGET=${next}" >> "${GITHUB_ENV}"
            echo "Dispatched the same persisted AIRI Phase-5 lineage directly to target ${next}."
          else
            echo "1B cumulative-token AIRI lineage rung complete; no larger automatic rung is configured yet."
          fi

      # The next bootstrap is queued before this workflow finishes.  The
      # Continuum bootstrap-gate therefore sees an active language bootstrap
      # and yields instead of interposing a swarm/champion replacement.
