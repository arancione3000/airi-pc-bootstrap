name: AIRI Generalist Research Continuum

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - AIRI Generalist Language Bootstrap
      - AIRI Generalist Architecture Search
      - AIRI Generalist Incumbent Recovery
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'computer/generalist_lm/**'
      - '.github/workflows/generalist-continuum.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: airi-generalist-free-speed
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  bootstrap-gate:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.gate.outputs.active }}
    steps:
      - name: Detect active Phase 5 language bootstrap
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl_common=(
            --fail-with-body -sS
            --connect-timeout 10
            --max-time 30
            --retry 3
            --retry-delay 2
            --retry-all-errors
          )
          active=0
          for workflow in generalist-bootstrap.yml generalist-architecture-search.yml generalist-incumbent-recovery.yml; do
            api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=20"
            if payload="$(curl "${curl_common[@]}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}")"; then
              count="$(jq '
                [
                  .workflow_runs[]
                  | select(
                      .status == "pending"
                      or .status == "queued"
                      or .status == "in_progress"
                      or .status == "waiting"
                      or .status == "requested"
                    )
                ] | length
              ' <<<"${payload}")"
              active="$((active + count))"
            fi
          done
          if (( active > 0 )); then
            echo "Bootstrap/Architecture Search/Incumbent Recovery owns the Generalist state-write window."
            echo "active=true" >> "${GITHUB_OUTPUT}"
          else
            echo "active=false" >> "${GITHUB_OUTPUT}"
          fi

  plan:
    needs: bootstrap-gate
    if: needs.bootstrap-gate.outputs.active != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      cycle: ${{ steps.matrix.outputs.cycle }}
    env:
      PYTHONPATH: computer
      STATE_REPO: /tmp/airi-generalist-state-repo
      STATE_DIR: /tmp/airi-generalist-state
      MATHESIS_STATE_DIR: /tmp/mathesis-signal-root/mathesis-state
      BUNDLE: /tmp/generalist-plan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: computer/mathesis/requirements.txt

      - name: Install cached CPU research runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r computer/mathesis/requirements.txt

      - name: Restore persistent Generalist and MATHESIS state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet             "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"             "${STATE_REPO}"
          cd "${STATE_REPO}"
          git config user.name "AIRI Generalist Free-Speed"
          git config user.email "airi-generalist@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin generalist-state >/dev/null 2>&1; then
            git fetch --quiet origin generalist-state:generalist-state
            git checkout --quiet generalist-state
          else
            git checkout --orphan generalist-state
            git rm -rf . >/dev/null 2>&1 || true
            mkdir -p generalist-state
            printf '%s\n' 'Persistent AIRI Generalist Free-Speed research state.'               > generalist-state/README.txt
            git add generalist-state/README.txt
            git commit -m "generalist-state: initialize"
            git push --quiet origin HEAD:generalist-state
          fi

          rm -rf "${STATE_DIR}" /tmp/mathesis-signal-root
          mkdir -p "${STATE_DIR}" /tmp/mathesis-signal-root
          cp -a "${STATE_REPO}/generalist-state/." "${STATE_DIR}/" || true

          if git ls-remote --exit-code --heads origin mathesis-state >/dev/null 2>&1; then
            git fetch --quiet origin mathesis-state:refs/remotes/origin/mathesis-state
            git archive refs/remotes/origin/mathesis-state mathesis-state               | tar -xf - -C /tmp/mathesis-signal-root
          fi

      - name: Plan swarm, adaptive curriculum, data growth and scaling
        id: matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "${BUNDLE}"
          mkdir -p "${BUNDLE}"

          python -m generalist_lm.generalist_swarm prepare             "${STATE_DIR}" "${BUNDLE}/plan.json"             --mathesis-state "${MATHESIS_STATE_DIR}"             --population-size 8             --max-params 20000000             --max-context 1024             --max-width 512             --max-layers 12             --curriculum-max-rows 8000             --data-max-new-bytes 12000000             --data-max-total-bytes 100000000

          cp -a "${STATE_DIR}" "${BUNDLE}/state"
          matrix="$(jq -c '.matrix' "${BUNDLE}/plan.json")"
          cycle="$(jq -r '.cycle' "${BUNDLE}/plan.json")"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "cycle=${cycle}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: generalist-plan
          path: /tmp/generalist-plan
          retention-days: 1

  stage1:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: computer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: computer/mathesis/requirements.txt
      - run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: generalist-plan
          path: /tmp/plan
      - name: Expanded candidate trial
        run: |
          python -m generalist_lm.generalist_swarm worker             /tmp/plan/plan.json /tmp/plan/state "${GITHUB_WORKSPACE}"             "/tmp/out-${{ matrix.index }}"             --index "${{ matrix.index }}"             --stage 1 --steps 8 --repeat-seeds 1 --pretrain-steps 2             --max-repo-bytes 5000000 --max-external-bytes 10000000
      - uses: actions/upload-artifact@v4
        with:
          name: generalist-stage1-${{ matrix.index }}
          path: /tmp/out-${{ matrix.index }}
          retention-days: 1

  reduce1:
    needs: [plan, stage1]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.reduce.outputs.matrix }}
    env:
      PYTHONPATH: computer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: generalist-stage1-*
          path: /tmp/results
      - name: Reduce eight candidates to four
        id: reduce
        run: |
          python -m generalist_lm.generalist_swarm select             /tmp/selection.json /tmp/results --survivors 4
          matrix="$(jq -c '.matrix' /tmp/selection.json)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  stage2:
    needs: [plan, reduce1]
    # Continue when the reducer succeeded even if one Stage-1 sibling was
    # cancelled by runner loss or a code update.
    if: ${{ always() && needs.plan.result == 'success' && needs.reduce1.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.reduce1.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: computer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: computer/mathesis/requirements.txt
      - run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: generalist-plan
          path: /tmp/plan
      - uses: actions/download-artifact@v4
        with:
          name: generalist-stage1-${{ matrix.index }}
          path: /tmp/previous
      - name: Continue survivor to cumulative 28-step base budget
        run: |
          python -m generalist_lm.generalist_swarm worker             /tmp/plan/plan.json /tmp/plan/state "${GITHUB_WORKSPACE}"             "/tmp/out-${{ matrix.index }}"             --index "${{ matrix.index }}"             --stage 2 --steps 20 --repeat-seeds 1 --pretrain-steps 4             --source-checkpoint /tmp/previous/best-checkpoint             --max-repo-bytes 10000000 --max-external-bytes 40000000
      - uses: actions/upload-artifact@v4
        with:
          name: generalist-stage2-${{ matrix.index }}
          path: /tmp/out-${{ matrix.index }}
          retention-days: 1

  reduce2:
    needs: [plan, stage2]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.reduce.outputs.matrix }}
    env:
      PYTHONPATH: computer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: generalist-stage2-*
          path: /tmp/results
      - name: Reduce four candidates to two
        id: reduce
        run: |
          python -m generalist_lm.generalist_swarm select             /tmp/selection.json /tmp/results --survivors 2
          matrix="$(jq -c '.matrix' /tmp/selection.json)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  stage3:
    needs: [plan, reduce2]
    # The reducer is the authority on surviving evidence; failed sibling
    # workers must not poison the whole continual-learning cycle.
    if: ${{ always() && needs.plan.result == 'success' && needs.reduce2.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.reduce2.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: computer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: computer/mathesis/requirements.txt
      - run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: generalist-plan
          path: /tmp/plan
      - uses: actions/download-artifact@v4
        with:
          name: generalist-stage2-${{ matrix.index }}
          path: /tmp/previous
      - name: Continue finalist to cumulative 76-step multi-seed base budget
        run: |
          python -m generalist_lm.generalist_swarm worker             /tmp/plan/plan.json /tmp/plan/state "${GITHUB_WORKSPACE}"             "/tmp/out-${{ matrix.index }}"             --index "${{ matrix.index }}"             --stage 3 --steps 48 --repeat-seeds 2 --pretrain-steps 8             --source-checkpoint /tmp/previous/best-checkpoint             --max-repo-bytes 20000000 --max-external-bytes 100000000
      - uses: actions/upload-artifact@v4
        with:
          name: generalist-stage3-${{ matrix.index }}
          path: /tmp/out-${{ matrix.index }}
          retention-days: 1

  finalize:
    needs: [plan, stage3]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: computer
      STATE_REPO: /tmp/airi-generalist-state-repo
      STATE_DIR: /tmp/airi-generalist-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: computer/mathesis/requirements.txt
      - run: |
          python -m pip install --disable-pip-version-check 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r computer/mathesis/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: generalist-plan
          path: /tmp/plan
      - uses: actions/download-artifact@v4
        with:
          pattern: generalist-stage3-*
          path: /tmp/finalists

      - name: Restore state branch and overlay planner state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet             "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"             "${STATE_REPO}"
          cd "${STATE_REPO}"
          git config user.name "AIRI Generalist Free-Speed"
          git config user.email "airi-generalist@users.noreply.github.com"
          git fetch --quiet origin generalist-state:generalist-state
          git checkout --quiet generalist-state
          rm -rf "${STATE_DIR}"
          mkdir -p "${STATE_DIR}"
          cp -a generalist-state/. "${STATE_DIR}/" || true
          cp -a /tmp/plan/state/. "${STATE_DIR}/"

      - name: External verifier and single-lineage adoption
        run: |
          python -m generalist_lm.generalist_swarm finalize \
            "${STATE_DIR}" /tmp/plan/plan.json \
            /tmp/final-status.json /tmp/finalists \
            --single-lineage
          jq -e '
            .ok == true
            and .policy.candidate_can_self_promote == false
            and .policy.direct_research_checkpoint_promotion == false
            and .policy.persistent_research_checkpoints == false
            and .policy.single_lineage_migration_required == true
            and .policy.external_reducer == true
            and .policy.external_pretrained == false
          ' /tmp/final-status.json

      - name: Resolve active AIRI lineage for qualification
        run: |
          set -euo pipefail
          active_rel="champion"
          if [[ -s "${STATE_DIR}/lineage.json" ]]; then
            active_rel="$(jq -r '.active_checkpoint // "champion"' "${STATE_DIR}/lineage.json")"
          fi
          test -s "${STATE_DIR}/${active_rel}/model.pt" -o -s "${STATE_DIR}/${active_rel}/model.index.json"
          echo "AIRI_GENERALIST_RESEARCH_CHECKPOINT=${STATE_DIR}/${active_rel}" >> "${GITHUB_ENV}"

      - name: Attempt normal production qualification
        env:
          AIRI_GENERALIST_PRODUCTION_STATE: ${{ env.STATE_DIR }}/production
          AIRI_GENERALIST_PRODUCTION_MIN_SCORE: '85'
          AIRI_GENERALIST_PRODUCTION_MIN_GAIN: '2'
          AIRI_GENERALIST_PRODUCTION_MAX_DOMAIN_REGRESSION: '0'
          AIRI_GENERALIST_RESEARCH_STATE: ${{ env.STATE_DIR }}
        run: |
          set -euo pipefail
          python -m generalist_lm.production_promotion \
            | tee "${STATE_DIR}/last-production-attempt.json"
          python -m generalist_lm.research_health

      - name: Persist health-gated Free-Speed state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${STATE_REPO}"
          rm -rf generalist-state
          mkdir -p generalist-state
          cp -a "${STATE_DIR}/." generalist-state/

          git add -A generalist-state
          git commit --allow-empty -m             "generalist-state: free-speed cycle ${{ needs.plan.outputs.cycle }}"
          git push --quiet origin HEAD:generalist-state

          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/generalist-state | awk '{print $1}')"
          test -n "${remote_sha}"
          test "${local_sha}" = "${remote_sha}"
          echo "AIRI Generalist Free-Speed state persisted at ${remote_sha}"


      - name: Hand off to the next autonomous Free-Speed cycle
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          next_target_file="${STATE_DIR}/bootstrap-next-target.json"
          if [[ -s "${next_target_file}" ]]; then
            next_target="$(jq -r '.target_tokens // 0' "${next_target_file}")"
            completed_target="$(jq -r '.completed_target_tokens // 0' "${next_target_file}")"
            if (( next_target > completed_target && next_target <= 1000000000 )); then
              # Consume the marker transactionally before dispatch so a later
              # scheduled Continuum cycle cannot fan out duplicate bootstraps.
              rm -f "${next_target_file}"
              cd "${STATE_REPO}"
              rm -f generalist-state/bootstrap-next-target.json
              git add -A generalist-state/bootstrap-next-target.json || true
              git commit --allow-empty -m "generalist-state: consume bootstrap target ${next_target}"
              git push --quiet origin HEAD:generalist-state
              cd "${GITHUB_WORKSPACE}"

              curl --fail-with-body -sS --retry 3 --retry-all-errors -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generalist-bootstrap.yml/dispatches" \
                -d "{\"ref\":\"main\",\"inputs\":{\"target_tokens\":\"${next_target}\"}}"
              echo "Converged swarm complete; dispatched next language rung ${next_target}."
              exit 0
            fi
            echo "Ignoring invalid/stale bootstrap-next-target marker." >&2
          fi

          bootstrap_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generalist-bootstrap.yml/runs"
          curl_common=(
            --fail-with-body -sS
            --connect-timeout 10
            --max-time 30
            --retry 3
            --retry-delay 2
            --retry-all-errors
          )

          if bootstrap_payload="$(curl "${curl_common[@]}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${bootstrap_api}?per_page=20")"; then
            bootstrap_active="$(jq '
              [
                .workflow_runs[]
                | select(
                    .status == "pending"
                    or .status == "queued"
                    or .status == "in_progress"
                    or .status == "waiting"
                    or .status == "requested"
                  )
              ] | length
            ' <<<"${bootstrap_payload}")"
            if (( bootstrap_active > 0 )); then
              echo "Phase 5 language bootstrap is active; pausing continuum handoff."
              exit 0
            fi
          fi

          recovery_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generalist-incumbent-recovery.yml/runs"
          if recovery_payload="$(curl "${curl_common[@]}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${recovery_api}?per_page=20")"; then
            recovery_active="$(jq '
              [
                .workflow_runs[]
                | select(
                    .status == "pending"
                    or .status == "queued"
                    or .status == "in_progress"
                    or .status == "waiting"
                    or .status == "requested"
                  )
              ] | length
            ' <<<"${recovery_payload}")"
            if (( recovery_active > 0 )); then
              echo "Architecture incumbent recovery is active; pausing continuum handoff."
              exit 0
            fi
          fi

          api_base="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generalist-continuum.yml/runs"
          curl_common=(
            --fail-with-body -sS
            --connect-timeout 10
            --max-time 30
            --retry 3
            --retry-delay 2
            --retry-all-errors
          )

          if payload="$(curl "${curl_common[@]}"             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "${api_base}?per_page=50")"; then
            active_other="$(jq --argjson current "${GITHUB_RUN_ID}" '
              [
                .workflow_runs[]
                | select(.id != $current)
                | select(
                    .status == "pending"
                    or .status == "queued"
                    or .status == "in_progress"
                    or .status == "waiting"
                    or .status == "requested"
                  )
              ] | length
            ' <<<"${payload}")"
          else
            echo "Could not inspect active runs after bounded retries; continuity takes priority."
            active_other=0
          fi

          if (( active_other > 0 )); then
            echo "Another Generalist continuum run is already queued/running; no duplicate handoff."
            exit 0
          fi

          curl "${curl_common[@]}" -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generalist-continuum.yml/dispatches"             -d '{"ref":"main"}'

          echo "Next autonomous AIRI Generalist Free-Speed cycle dispatched."
